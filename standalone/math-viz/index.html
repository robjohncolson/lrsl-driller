        this.stepIndex = 1;
        this.equationStage = 0;
        this.orbitWeight = 0;
        this.orbitPhase = 0;
        this.state = {
          merge: 0,
          anchor: 0,
          cuts: 0,
          split: 0,
          slab1: 0,
          slab2Arrange: 0,
          reveal: 0,
          eq: 0
        };
        this.geo = null;
      }

      init(manager) {
        if (this.scene) return;
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(COLOR_NUM.background);
        addSoftLights(this.scene);
        this.group = new THREE.Group();
        this.scene.add(this.group);

        this.camera = new THREE.PerspectiveCamera(48, 1, 0.5, 220);
        this.camera.position.set(12, 10, 14);
        this.controls = new OrbitControls(this.camera, manager.renderer.domElement);
        this.controls.enableDamping = true;
        this.controls.dampingFactor = 0.08;
        this.controls.enablePan = true;
        this.controls.minDistance = 2;
        this.controls.maxDistance = 150;
        this.controls.maxPolarAngle = Math.PI * 0.95;
        this.controls.target.set(0, 2.5, 0);

        this.rebuild();
      }

      onActivate(manager) {
        this.init(manager);
        this.controls.enabled = true;
        this.resize(manager.container.clientWidth, manager.container.clientHeight);
      }

      onDeactivate() {
        if (this.controls) this.controls.enabled = false;
        this.queue.clear();
        labelManager.clearGroup(this.id);
      }

      resize(width, height) {
        this.camera.aspect = width / Math.max(1, height);
        this.camera.updateProjectionMatrix();
      }

      makeBlock(width, height, depth, color) {
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(width, height, depth),
          new THREE.MeshStandardMaterial({
            color,
            roughness: 0.78,
            metalness: 0.05,
            transparent: true,
            opacity: 0
          })
        );
        this.group.add(mesh);
        return mesh;
      }

      makeDashedLine(a, b, color = 0xffffff) {
        const line = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([a, b]),
          new THREE.LineDashedMaterial({
            color,
            dashSize: 0.34,
            gapSize: 0.2,
            transparent: true,
            opacity: 0
          })
        );
        line.computeLineDistances();
        this.cutLines.add(line);
        return line;
      }

      setDimensionOpacity(dim, opacity) {
        if (!dim) return;
        dim.mesh.material.opacity = opacity;
        labelManager.setOpacity(dim.label, opacity);
      }

      rebuild() {
        disposeObject3D(this.group);
        this.group.clear();

        const floor = new THREE.Mesh(
          new THREE.PlaneGeometry(42, 42),
          new THREE.MeshStandardMaterial({ color: 0x141436, roughness: 0.95, metalness: 0 })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.02;
        this.group.add(floor);

        const rawA = clamp(this.params.a, 1, 6);
        const rawB = clamp(this.params.b, 1, 6);
        const A = Math.max(rawA, rawB);
        const B = Math.min(rawA, rawB);
        const D = Math.max(0.001, A - B);
        this.geo = { rawA, rawB, A, B, D };

        const primaryColor = rawA >= rawB ? COLOR_NUM.a : COLOR_NUM.b;
        const secondaryColor = rawA >= rawB ? COLOR_NUM.b : COLOR_NUM.a;
        this.primaryLabelText = `${Math.max(rawA, rawB)}^3`;
        this.secondaryLabelText = `${Math.min(rawA, rawB)}^3`;

        const primaryMat = new THREE.MeshStandardMaterial({
          color: primaryColor,
          roughness: 0.8,
          metalness: 0.06,
          transparent: true,
          opacity: 0.88
        });
        const secondaryMat = new THREE.MeshStandardMaterial({
          color: secondaryColor,
          roughness: 0.8,
          metalness: 0.06,
          transparent: true,
          opacity: 0.88
        });

        const primaryFlushX = -B / 2;
        const secondaryFlushX = A / 2;
        const gap = 0.9 + (A + B) * 0.18;
        const primaryStartX = primaryFlushX - gap;
        const secondaryStartX = secondaryFlushX + gap;

        this.primaryCube = new THREE.Mesh(new THREE.BoxGeometry(A, A, A), primaryMat);
        this.secondaryCube = new THREE.Mesh(new THREE.BoxGeometry(B, B, B), secondaryMat);
        this.primaryCube.position.set(primaryStartX, A / 2, 0);
        this.secondaryCube.position.set(secondaryStartX, B / 2, 0);
        this.primaryCube.userData = {
          flushX: primaryFlushX,
          startX: primaryStartX,
          y: A / 2,
          z: 0
        };
        this.secondaryCube.userData = {
          flushX: secondaryFlushX,
          startX: secondaryStartX,
          y: B / 2,
          z: 0
        };

        this.primaryEdges = new THREE.LineSegments(
          new THREE.EdgesGeometry(new THREE.BoxGeometry(A, A, A)),
          new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, depthWrite: false })
        );
        this.secondaryEdges = new THREE.LineSegments(
          new THREE.EdgesGeometry(new THREE.BoxGeometry(B, B, B)),
          new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, depthWrite: false })
        );
        this.primaryEdges.scale.setScalar(1.001);
        this.secondaryEdges.scale.setScalar(1.001);
        this.primaryEdges.renderOrder = 1;
        this.secondaryEdges.renderOrder = 1;

        this.unifiedPrimaryEdges = new THREE.LineSegments(
          new THREE.EdgesGeometry(new THREE.BoxGeometry(A, A, A)),
          new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false })
        );
        this.unifiedSecondaryEdges = new THREE.LineSegments(
          new THREE.EdgesGeometry(new THREE.BoxGeometry(B, B, B)),
          new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false })
        );
        this.unifiedPrimaryEdges.scale.setScalar(1.002);
        this.unifiedSecondaryEdges.scale.setScalar(1.002);
        this.unifiedPrimaryEdges.renderOrder = 2;
        this.unifiedSecondaryEdges.renderOrder = 2;

        this.primaryCube.add(this.primaryEdges, this.unifiedPrimaryEdges);
        this.secondaryCube.add(this.secondaryEdges, this.unifiedSecondaryEdges);
        this.group.add(this.primaryCube, this.secondaryCube);

        this.cutLines = new THREE.Group();
        this.group.add(this.cutLines);

        const xL = primaryFlushX - A / 2;
        const xR = primaryFlushX + A / 2;
        const yBottom = 0;
        const ySplit = B;
        const yTop = A;
        const zFront = A / 2;
        const zCut = A / 2 - D;
        const zBack = -A / 2;

        this.makeDashedLine(new THREE.Vector3(xL, yBottom, zCut), new THREE.Vector3(xR, yBottom, zCut));
        this.makeDashedLine(new THREE.Vector3(xL, yTop, zCut), new THREE.Vector3(xR, yTop, zCut));
        this.makeDashedLine(new THREE.Vector3(xR, ySplit, zCut), new THREE.Vector3(xR, ySplit, zBack));
        this.makeDashedLine(new THREE.Vector3(xL, ySplit, zCut), new THREE.Vector3(xL, ySplit, zBack));
        this.makeDashedLine(new THREE.Vector3(xL, ySplit, zBack), new THREE.Vector3(xR, ySplit, zBack));

        this.block1 = this.makeBlock(A, A, D, 0x6dbed4); // A x A x (A-B)
        this.block2 = this.makeBlock(A, B, D, 0x4da4bf); // A x B x (A-B)
        this.block3 = this.makeBlock(A, B, B, 0x8fb16a); // A x B x B

        this.block1.userData.base = new THREE.Vector3(primaryFlushX, A / 2, zFront - D / 2);
        this.block2.userData.base = new THREE.Vector3(primaryFlushX, B / 2, zFront - D / 2);
        this.block3.userData.base = new THREE.Vector3(primaryFlushX, B / 2, zBack + B / 2);

        this.block1.userData.split = this.block1.userData.base.clone().add(new THREE.Vector3(-A * 0.25, A * 0.08, A * 0.24));
        this.block2.userData.split = this.block2.userData.base.clone().add(new THREE.Vector3(A * 0.24, -A * 0.06, -A * 0.28));
        this.block3.userData.split = this.block3.userData.base.clone().add(new THREE.Vector3(A * 0.34, 0, -A * 0.2));

        this.block3.userData.slab1Target = new THREE.Vector3(-B / 2, B / 2, -A * 0.55);

        this.slab1 = new THREE.Mesh(
          new THREE.BoxGeometry(A + B, B, B), // (A+B) x B x B
          new THREE.MeshStandardMaterial({
            color: 0xc0b85f,
            roughness: 0.76,
            metalness: 0.05,
            transparent: true,
            opacity: 0
          })
        );
        this.slab1.userData.base = new THREE.Vector3(0, B / 2 + 0.1, -A * 0.55);
        this.slab1.userData.reveal = new THREE.Vector3(0, B / 2 - 0.85, -A * 0.55);
        this.group.add(this.slab1);

        this.slab2 = new THREE.Mesh(
          new THREE.BoxGeometry(A + B, A, D), // (A+B) x A x (A-B)
          new THREE.MeshStandardMaterial({
            color: 0x58c4dd,
            roughness: 0.78,
            metalness: 0.05,
            transparent: true,
            opacity: 0
          })
        );
        this.slab2.userData.base = new THREE.Vector3(0, B + A / 2 + 0.5, -A * 0.15);
        this.slab2.userData.reveal = new THREE.Vector3(0, B + A / 2 + 1.25, -A * 0.15);
        this.group.add(this.slab2);

        this.block1.userData.slab2Target = new THREE.Vector3(-B / 2, this.slab2.userData.base.y, this.slab2.userData.base.z);
        this.block2.userData.slab2Target = new THREE.Vector3(A / 2, this.slab2.userData.base.y, this.slab2.userData.base.z);
        this.block2.userData.slab2Rotation = -Math.PI / 2;

        this.secondaryCube.userData.groupSplit = this.block3.userData.split.clone().add(new THREE.Vector3(A / 2 + B / 2 + 0.25, 0, 0));
        this.secondaryCube.userData.slab1Target = new THREE.Vector3(A / 2, B / 2, -A * 0.55);

        labelManager.clearGroup(this.id);

        this.dimAB = createDimensionLine(this.group, labelManager, {
          start: new THREE.Vector3(-(A + B) / 2, 0.02, A / 2 + 0.8),
          end: new THREE.Vector3((A + B) / 2, 0.02, A / 2 + 0.8),
          color: COLOR_NUM.result,
          labelText: "a+b",
          labelClass: "viz-label viz-label--dim",
          groupId: this.id,
          opacity: 0
        });

        const slab1Reveal = this.slab1.userData.reveal;
        const slab2Reveal = this.slab2.userData.reveal;
        this.dimSlab1 = createDimensionLine(this.group, labelManager, {
          start: new THREE.Vector3(slab1Reveal.x - (A + B) / 2, slab1Reveal.y, slab1Reveal.z),
          end: new THREE.Vector3(slab1Reveal.x + (A + B) / 2, slab1Reveal.y, slab1Reveal.z),
          color: COLOR_NUM.result,
          labelText: "a+b",
          labelClass: "viz-label viz-label--dim",
          groupId: this.id,
          offset: new THREE.Vector3(0, -B * 0.58 - 0.28, B * 0.65 + 0.44),
          opacity: 0
        });

        this.dimSlab2 = createDimensionLine(this.group, labelManager, {
          start: new THREE.Vector3(slab2Reveal.x - (A + B) / 2, slab2Reveal.y, slab2Reveal.z),
          end: new THREE.Vector3(slab2Reveal.x + (A + B) / 2, slab2Reveal.y, slab2Reveal.z),
          color: COLOR_NUM.result,
          labelText: "a+b",
          labelClass: "viz-label viz-label--dim",
          groupId: this.id,
          offset: new THREE.Vector3(0, A * 0.58 + 0.3, D * 0.65 + 0.42),
          opacity: 0
        });

        this.labels = {
          primaryVolume: labelManager.addLabel({
            tex: this.primaryLabelText,
            className: "viz-label viz-label--medium",
            color: `#${primaryColor.toString(16).padStart(6, "0")}`,
            groupId: this.id,
            getWorldPos: () => this.primaryCube.position.clone().add(new THREE.Vector3(0, A / 2 + 0.75, 0)),
            opacity: 1
          }),
          secondaryVolume: labelManager.addLabel({
            tex: this.secondaryLabelText,
            className: "viz-label viz-label--medium",
            color: `#${secondaryColor.toString(16).padStart(6, "0")}`,
            groupId: this.id,
            getWorldPos: () => this.secondaryCube.position.clone().add(new THREE.Vector3(0, B / 2 + 0.75, 0)),
            opacity: 1
          }),
          totalVolume: labelManager.addLabel({
            text: `Total volume = ${rawA ** 3 + rawB ** 3}`,
            className: "viz-label viz-label--medium",
            color: COLOR_HEX.result,
            groupId: this.id,
            getWorldPos: () => this.primaryCube.position.clone()
              .lerp(this.secondaryCube.position, 0.5)
              .add(new THREE.Vector3(0, A / 2 + 1.65, 0.15)),
            opacity: 0
          }),
          slab1Area: labelManager.addLabel({
            tex: `${B}^2`,
            className: "viz-label viz-label--medium",
            color: COLOR_HEX.b,
            groupId: this.id,
            getWorldPos: () => this.slab1.position.clone().add(new THREE.Vector3(0, B / 2 + 0.55, 0)),
            opacity: 0
          }),
          slab2Area: labelManager.addLabel({
            tex: `${A}^2-${A * B}`,
            className: "viz-label viz-label--medium",
            color: COLOR_HEX.a,
            groupId: this.id,
            getWorldPos: () => this.slab2.position.clone().add(new THREE.Vector3(0, D / 2 + 0.55, 0)),
            opacity: 0
          }),
          crossTotal: labelManager.addLabel({
            tex: `${A}^2-${A * B}+${B}^2`,
            className: "viz-label viz-label--dim",
            color: COLOR_HEX.result,
            groupId: this.id,
            worldPos: new THREE.Vector3(0, A + 1.2, B / 2),
            opacity: 0
          })
        };

        this.equationStage = 0;
        this.orbitWeight = 0;
        this.applyStepState(1);
      }

      applyVisualTargets(targets) {
        this.state = { ...targets };
        const { A, B, D } = this.geo;

        const p = this.primaryCube.userData;
        const s = this.secondaryCube.userData;
        const primaryX = p.startX + (p.flushX - p.startX) * targets.merge;
        const secondaryX = s.startX + (s.flushX - s.startX) * targets.merge;

        this.primaryCube.position.set(primaryX, p.y, p.z);

        const xShift = primaryX - p.flushX;
        this.cutLines.position.x = xShift;
        this.cutLines.children.forEach((line) => {
          line.material.opacity = 0.9 * targets.cuts * (1 - 0.28 * targets.reveal) * (1 - 0.35 * targets.anchor);
        });

        const b1Base = this.block1.userData.base.clone().add(new THREE.Vector3(xShift, 0, 0));
        const b2Base = this.block2.userData.base.clone().add(new THREE.Vector3(xShift, 0, 0));
        const b3Base = this.block3.userData.base.clone().add(new THREE.Vector3(xShift, 0, 0));
        const b1Split = this.block1.userData.split.clone().add(new THREE.Vector3(xShift, 0, 0));
        const b2Split = this.block2.userData.split.clone().add(new THREE.Vector3(xShift, 0, 0));
        const b3Split = this.block3.userData.split.clone().add(new THREE.Vector3(xShift, 0, 0));

        const block1Pos = b1Base.clone().lerp(b1Split, targets.split);
        const block2Pos = b2Base.clone().lerp(b2Split, targets.split);
        const block3Pos = b3Base.clone().lerp(b3Split, targets.split);

        const block1Slab2Target = this.block1.userData.slab2Target.clone();
        const block2Slab2Target = this.block2.userData.slab2Target.clone();
        const block3Slab1Target = this.block3.userData.slab1Target.clone();

        const slab2RotateT = clamp(targets.slab2Arrange * 2, 0, 1);
        const slab2SlideT = clamp((targets.slab2Arrange - 0.5) * 2, 0, 1);

        block1Pos.lerp(block1Slab2Target, slab2SlideT);
        block2Pos.lerp(block2Slab2Target, slab2SlideT);
        block3Pos.lerp(block3Slab1Target, targets.slab1);

        this.block1.position.copy(block1Pos);
        this.block2.position.copy(block2Pos);
        this.block3.position.copy(block3Pos);
        this.block2.rotation.set(0, 0, this.block2.userData.slab2Rotation * slab2RotateT);
        this.block1.rotation.set(0, 0, 0);
        this.block3.rotation.set(0, 0, 0);

        const secondaryGrouped = this.secondaryCube.userData.groupSplit.clone().add(new THREE.Vector3(xShift, 0, 0));
        const secondarySlab1Target = this.secondaryCube.userData.slab1Target.clone();
        const secondaryPos = new THREE.Vector3(secondaryX, s.y, s.z)
          .lerp(secondaryGrouped, targets.split)
          .lerp(secondarySlab1Target, targets.slab1);
        this.secondaryCube.position.copy(secondaryPos);

        this.primaryCube.material.opacity = 0.88 * (1 - 0.9 * targets.split) * (1 - 0.25 * targets.anchor);
        this.secondaryCube.material.opacity = 0.88 * (1 - 0.95 * targets.slab1) * (1 - 0.25 * targets.anchor);
        this.block1.material.opacity = 0.9 * targets.split * (1 - 0.93 * slab2SlideT);
        this.block2.material.opacity = 0.9 * targets.split * (1 - 0.93 * slab2SlideT);
        this.block3.material.opacity = 0.9 * targets.split * (1 - 0.95 * targets.slab1);

        this.slab1.position.lerpVectors(this.slab1.userData.base, this.slab1.userData.reveal, targets.reveal);
        this.slab2.position.lerpVectors(
          this.slab2.userData.base,
          this.slab2.userData.reveal,
          targets.reveal
        );
        this.slab1.material.opacity = 0.9 * targets.slab1;
        this.slab2.material.opacity = 0.92 * slab2SlideT;

        this.unifiedPrimaryEdges.material.opacity = 0.88 * targets.anchor * (1 - 0.7 * targets.reveal);
        this.unifiedSecondaryEdges.material.opacity = 0.88 * targets.anchor * (1 - 0.7 * targets.reveal);

        const dimOpacity = clamp(targets.merge * (1 - 0.35 * targets.reveal) * (1 + 0.18 * targets.anchor), 0, 1);
        this.setDimensionOpacity(this.dimAB, dimOpacity);
        const slabDimOpacity = clamp((targets.reveal - 0.05) / 0.95, 0, 1);
        this.setDimensionOpacity(this.dimSlab1, slabDimOpacity);
        this.setDimensionOpacity(this.dimSlab2, slabDimOpacity);

        labelManager.setOpacity(this.labels.primaryVolume, 1 - 0.75 * targets.split);
        labelManager.setOpacity(this.labels.secondaryVolume, 1 - 0.55 * targets.slab1);
        labelManager.setOpacity(this.labels.totalVolume, clamp(targets.anchor * (1 - 0.85 * targets.reveal), 0, 1));
        labelManager.setOpacity(this.labels.slab1Area, clamp((targets.slab1 - 0.1) / 0.9, 0, 1));
        labelManager.setOpacity(this.labels.slab2Area, clamp((targets.slab2Arrange - 0.1) / 0.9, 0, 1));
        labelManager.setOpacity(this.labels.crossTotal, targets.reveal);

        this.equationStage = targets.eq;
        this.orbitWeight = clamp(0.15 * targets.anchor + 0.22 * targets.slab1 + 0.42 * targets.slab2Arrange + 0.8 * targets.reveal, 0, 1);
      }

      lerpTargets(start, end, t) {
        const out = {};
        for (const key of Object.keys(end)) {
          if (key === "eq") {
            out[key] = t < 0.72 ? start[key] : end[key];
          } else {
            out[key] = start[key] + (end[key] - start[key]) * t;
          }
        }
        return out;
      }

      setParams(params) {
        const a = clamp(params.a ?? this.params.a, 1, 6);
        const b = clamp(params.b ?? this.params.b, 1, 6);
        this.params = { a, b };
        this.rebuild();
      }

      resetExplore() {
        this.setParams({ a: 2, b: 3 });
      }

      hasStepControls() {
        return true;
      }

      getStepCount() {
        return 7;
      }

      getStepIndex() {
        return this.stepIndex;
      }

      getStepTargets(step) {
        if (step <= 1) {
          return { merge: 0, anchor: 0, cuts: 0, split: 0, slab1: 0, slab2Arrange: 0, reveal: 0, eq: 0 };
        }
        if (step === 2) {
          return { merge: 1, anchor: 0, cuts: 0, split: 0, slab1: 0, slab2Arrange: 0, reveal: 0, eq: 1 };
        }
        if (step === 3) {
          return { merge: 1, anchor: 1, cuts: 0, split: 0, slab1: 0, slab2Arrange: 0, reveal: 0, eq: 1 };
        }
        if (step === 4) {
          return { merge: 1, anchor: 0.85, cuts: 1, split: 0, slab1: 0, slab2Arrange: 0, reveal: 0, eq: 1 };
        }
        if (step === 5) {
          return { merge: 1, anchor: 0.3, cuts: 1, split: 1, slab1: 1, slab2Arrange: 0, reveal: 0, eq: 1 };
        }
        if (step === 6) {
          return { merge: 1, anchor: 0, cuts: 1, split: 1, slab1: 1, slab2Arrange: 1, reveal: 0.2, eq: 1 };
        }
        return { merge: 1, anchor: 0, cuts: 0.45, split: 1, slab1: 1, slab2Arrange: 1, reveal: 1, eq: 2 };
      }

      applyTargets(targets) {
        this.applyVisualTargets(targets);
      }

      applyStepState(step) {
        const clamped = clamp(step, 1, this.getStepCount());
        this.queue.clear();
        this.stepIndex = clamped;
        this.applyTargets(this.getStepTargets(clamped));
        notifyVisualUpdate();
      }

      setStep(step, animate = false) {
        const clamped = clamp(step, 1, this.getStepCount());
        if (!animate || this.getReduceMotion()) {
          this.applyStepState(clamped);
          return;
        }
        const start = this.getStepTargets(this.stepIndex);
        const end = this.getStepTargets(clamped);
        this.queue.clear();
        this.queue.run([
          {
            duration: DEFAULT_STEP_MS,
            pause: INTER_STEP_PAUSE_MS,
            onUpdate: (t) => {
              this.applyTargets(this.lerpTargets(start, end, t));
            },
            onEnd: () => {
              this.stepIndex = clamped;
              this.applyTargets(end);
              notifyVisualUpdate();
            }
          }
        ]);
      }

      playAnimation() {
        this.setStep(this.getStepCount(), true);
      }

      tick(dt, dtMs) {
        this.queue.update(dtMs);
        this.orbitPhase += dt;
        if (!this.camera || !this.geo) return;
        // Only force camera position while animation queue is active
        if (this.orbitWeight > 0.001 && this.queue.active) {
          const base = new THREE.Vector3(12, 10, 14);
          const alt = new THREE.Vector3(10.4, 11.8, 16.2);
          const blend = clamp(0.42 * this.orbitWeight + Math.sin(this.orbitPhase * 0.8) * 0.05 * this.orbitWeight, 0, 1);
          this.camera.position.lerpVectors(base, alt, blend);
          const targetY = this.geo.A * 0.35;
          const baseTarget = new THREE.Vector3(0, targetY, 0);
          const slabCentroid = this.slab1.position.clone().add(this.slab2.position).multiplyScalar(0.5);
          const targetBlend = clamp(0.2 * this.state.slab1 + 0.45 * this.state.slab2Arrange + 0.9 * this.state.reveal, 0, 1);
          const desiredTarget = baseTarget.clone().lerp(slabCentroid, targetBlend);
          if (this.controls) {
            this.controls.target.lerp(desiredTarget, 0.12);
          } else {
            this.camera.lookAt(desiredTarget);
          }
        }
      }

      updateLabels(canvas) {
        labelManager.update(this.camera, canvas, true);
      }

      equationTex() {
        const { a, b } = this.params;
        if (this.equationStage <= 0) {
          return `\\color{${COLOR_HEX.a}}{${a}^3} + \\color{${COLOR_HEX.b}}{${b}^3}`;
        }
        if (this.equationStage === 1) {
          return `\\color{${COLOR_HEX.a}}{${a}^3} + \\color{${COLOR_HEX.b}}{${b}^3} = ?`;
        }
        return `\\color{${COLOR_HEX.a}}{${a}^3} + \\color{${COLOR_HEX.b}}{${b}^3} = (${a}+${b})(\\color{${COLOR_HEX.a}}{${a ** 2}}-\\color{${COLOR_HEX.ab}}{${a * b}}+\\color{${COLOR_HEX.b}}{${b ** 2}})`;
      }

      overlay() {
        const messages = [
          "Two cubes on a shared floor",
          "Merge cubes flush to expose total width (a+b)",
          "Show unified wireframe anchor: total volume = a^3 + b^3",
          "Dashed cuts define block1, block2, block3 in a^3",
          "Snap b^3 to block3 to form slab1: (a+b) x b x b",
          "Rotate then slide block2 into block1 for slab2",
          "Reveal both slabs sharing factor (a+b)"
        ];
        const { a, b } = this.params;
        return {
          left: `Step ${this.stepIndex}/7 | a=${a}, b=${b}`,
          right: messages[this.stepIndex - 1]
        };
      }

      showDrillFeedback(problem) {
        if (problem && problem.a && problem.b) this.setParams({ a: problem.a, b: problem.b });
        this.playAnimation();
      }
    }


    class DiffCubesMode {

      makeDashedLine(a, b, color = 0xffffff) {

      rebuild() {

        this.wire = new THREE.LineSegments(

        );
        this.wire.scale.setScalar(1.001);

        this.removedCube = new THREE.Mesh(

        const corner = new THREE.Vector3(a / 2 - b / 2, a / 2 - b / 2, a / 2 - b / 2);

        this.group.add(this.removedCube);

        this.cutLines = new THREE.Group();
        this.group.add(this.cutLines);
        const xL = -a / 2;
        const xR = a / 2;
        const yB = -a / 2;
        const yTopSplit = a / 2 - b;
        const yT = a / 2;
        const zBackSplit = a / 2 - b;
        const zF = a / 2;

        this.makeDashedLine(new THREE.Vector3(xL, yB, zBackSplit), new THREE.Vector3(xR, yB, zBackSplit));
        this.makeDashedLine(new THREE.Vector3(xL, yTopSplit, zF), new THREE.Vector3(xR, yTopSplit, zF));
        this.makeDashedLine(new THREE.Vector3(xR - b, yTopSplit, zBackSplit), new THREE.Vector3(xR - b, yT, zBackSplit));
        this.makeDashedLine(new THREE.Vector3(xR - b, yTopSplit, zF), new THREE.Vector3(xR - b, yTopSplit, zBackSplit));

        this.slabA = this.makeSlab(a, a, d, COLOR_NUM.a);
        this.slabAB = this.makeSlab(a, d, b, COLOR_NUM.ab);
        this.slabB = this.makeSlab(d, b, b, COLOR_NUM.b);
        const makeEdges = (w, h, depth, color) => {
          const edges = new THREE.LineSegments(
            new THREE.EdgesGeometry(new THREE.BoxGeometry(w, h, depth)),
            new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.55, depthWrite: false })
          );
          edges.scale.setScalar(1.001);

        this.slabA.add(makeEdges(a, a, d, COLOR_NUM.a));
        this.slabAB.add(makeEdges(a, d, b, COLOR_NUM.ab));
        this.slabB.add(makeEdges(d, b, b, COLOR_NUM.b));

        this.slabA.userData.base = new THREE.Vector3(0, 0, -b / 2);
        this.slabA.userData.explode = new THREE.Vector3(-a * 0.72, 0, -a * 0.78);
        this.slabA.userData.align = this.slabA.userData.explode.clone();
        this.slabA.userData.final = new THREE.Vector3(0, a * 0.58, -a * 0.84);
        this.slabA.userData.rotX = 0;
        this.slabA.userData.rotY = 0;

        this.slabAB.userData.base = new THREE.Vector3(0, -b / 2, d / 2);
        this.slabAB.userData.explode = new THREE.Vector3(0, -a * 0.78, 0);
        this.slabAB.userData.align = new THREE.Vector3(0, 0, -a * 0.84);
        this.slabAB.userData.final = new THREE.Vector3(0, -a * 0.04, -a * 0.84);
        this.slabAB.userData.rotX = -Math.PI / 2;
        this.slabAB.userData.rotY = 0;

        this.slabB.userData.base = new THREE.Vector3(-b / 2, d / 2, d / 2);
        this.slabB.userData.explode = new THREE.Vector3(a * 0.82, 0, 0);
        this.slabB.userData.align = new THREE.Vector3(a * 0.74, 0, -a * 0.84);
        this.slabB.userData.final = new THREE.Vector3(0, -a * 0.66, -a * 0.84);

            end: new THREE.Vector3(-a / 2, -a / 2, a / 2),

        this.dimShared = createDimensionLine(this.group, labelManager, {
          start: new THREE.Vector3(a * 0.72, 0, -a * 0.84 - d / 2),

        });

        this.dimAligned = [
          createDimensionLine(this.group, labelManager, {
            start: new THREE.Vector3(
              this.slabA.userData.align.x,
              this.slabA.userData.align.y,
              this.slabA.userData.align.z - d / 2
            ),
            end: new THREE.Vector3(
              this.slabA.userData.align.x,
              this.slabA.userData.align.y,
              this.slabA.userData.align.z + d / 2
            ),
            color: COLOR_NUM.result,
            labelText: "a-b",
            groupId: this.id,
            offset: new THREE.Vector3(a * 0.58, 0, 0),
            opacity: 0
          }),
          createDimensionLine(this.group, labelManager, {
            start: new THREE.Vector3(
              this.slabAB.userData.align.x,
              this.slabAB.userData.align.y,
              this.slabAB.userData.align.z - d / 2
            ),
            end: new THREE.Vector3(
              this.slabAB.userData.align.x,
              this.slabAB.userData.align.y,
              this.slabAB.userData.align.z + d / 2
            ),
            color: COLOR_NUM.result,
            labelText: "a-b",
            groupId: this.id,
            offset: new THREE.Vector3(a * 0.58, 0, 0),
            opacity: 0
          }),
          createDimensionLine(this.group, labelManager, {
            start: new THREE.Vector3(
              this.slabB.userData.align.x,
              this.slabB.userData.align.y,
              this.slabB.userData.align.z - d / 2
            ),
            end: new THREE.Vector3(
              this.slabB.userData.align.x,
              this.slabB.userData.align.y,
              this.slabB.userData.align.z + d / 2
            ),
            color: COLOR_NUM.result,
            labelText: "a-b",
            groupId: this.id,
            offset: new THREE.Vector3(b * 0.62, 0, 0),
            opacity: 0
          })
        ];

        this.labels = {
          a2: labelManager.addLabel({
            tex: "a^2",
            className: "viz-label viz-label--medium",
            color: COLOR_HEX.a,
            groupId: this.id,
            getWorldPos: () => this.slabA.position.clone().add(new THREE.Vector3(0, a * 0.52, 0)),
            opacity: 0
          }),
          ab: labelManager.addLabel({
            tex: "ab",
            className: "viz-label viz-label--medium",
            color: COLOR_HEX.ab,
            groupId: this.id,
            getWorldPos: () => this.slabAB.position.clone().add(new THREE.Vector3(0, b * 0.52, 0)),
            opacity: 0
          }),
          b2: labelManager.addLabel({
            tex: "b^2",
            className: "viz-label viz-label--medium",
            color: COLOR_HEX.b,
            groupId: this.id,
            getWorldPos: () => this.slabB.position.clone().add(new THREE.Vector3(0, b * 0.52, 0)),
            opacity: 0
          })
        };

        this.equationStage = 0;
        this.orbitWeight = 0;
        this.applyStepState(1);
      }

      applyVisualTargets(targets) {
        this.state = { ...targets };
        const { a, b } = this.geo;

        const diagonal = new THREE.Vector3(0.7, 1, 0.65).normalize().multiplyScalar(b * 2.5 * targets.remove);
        const corner = this.removedCube.userData.corner;
        this.removedCube.position.copy(corner.clone().add(diagonal));
        this.removedCube.material.opacity = 0.95 * Math.sin(Math.PI * clamp(targets.remove, 0, 1));

        this.cubeFill.material.opacity = 0.72 * (1 - 0.96 * targets.decompose);
        this.cutLines.children.forEach((line) => {
          line.material.opacity = 0.85 * targets.decompose * (1 - 0.35 * targets.stack);
        });

        const slabs = [this.slabA, this.slabAB, this.slabB];
        const alignRotateT = clamp(targets.align * 2, 0, 1);
        const alignSlideT = clamp((targets.align - 0.5) * 2, 0, 1);
        for (const slab of slabs) {
          const p = slab.userData.base.clone()
            .lerp(slab.userData.explode, targets.explode)
            .lerp(slab.userData.align, alignSlideT)
            .lerp(slab.userData.final, targets.stack);
          slab.position.copy(p);
          slab.rotation.x = slab.userData.rotX * alignRotateT;
          slab.rotation.y = slab.userData.rotY * alignRotateT;
          slab.material.opacity = 0.06 + 0.82 * targets.decompose;
        }

        labelManager.setOpacity(this.labels.a2, targets.labels);
        labelManager.setOpacity(this.labels.ab, targets.labels);
        labelManager.setOpacity(this.labels.b2, targets.labels);

        this.setDimensionOpacityList(this.dimA, 1 - 0.55 * targets.decompose);
        this.setDimensionOpacity(this.dimB, clamp(targets.remove - 0.4 * targets.decompose, 0, 1));
        const alignDimOpacity = clamp((targets.align - 0.12) / 0.88, 0, 1) * (1 - 0.85 * targets.stack);
        this.setDimensionOpacityList(this.dimAligned, alignDimOpacity);
        this.setDimensionOpacity(this.dimShared, targets.stack);

        this.equationStage = targets.eq;
        this.orbitWeight = clamp(0.25 * targets.explode + 0.45 * targets.align + 0.72 * targets.stack, 0, 1);
      }

      lerpTargets(start, end, t) {
        const out = {};
        for (const key of Object.keys(end)) {
          if (key === "eq") {
            out[key] = t < 0.72 ? start[key] : end[key];
          } else {
            out[key] = start[key] + (end[key] - start[key]) * t;
          }
        }
        return out;
      }

      setParams(params) {
        const { a, b } = clampDiffPair(params.a ?? this.params.a, params.b ?? this.params.b, 6);
        this.params = { a, b };
        this.rebuild();
      }

      resetExplore() {
        this.setParams({ a: 5, b: 2 });
      }

      hasStepControls() {
        return true;
      }

      getStepCount() {
        return 6;
      }

      getStepIndex() {
        return this.stepIndex;
      }

      getStepTargets(step) {
        if (step <= 1) {
          return { remove: 0, decompose: 0, explode: 0, align: 0, stack: 0, labels: 0, eq: 0 };
        }
        if (step === 2) {
          return { remove: 1, decompose: 0, explode: 0, align: 0, stack: 0, labels: 0, eq: 1 };
        }
        if (step === 3) {
          return { remove: 1, decompose: 1, explode: 0, align: 0, stack: 0, labels: 0.25, eq: 1 };
        }
        if (step === 4) {
          return { remove: 1, decompose: 1, explode: 1, align: 0, stack: 0, labels: 0.85, eq: 1 };
        }
        if (step === 5) {
          return { remove: 1, decompose: 1, explode: 1, align: 1, stack: 0, labels: 1, eq: 1 };
        }
        return { remove: 1, decompose: 1, explode: 1, align: 1, stack: 1, labels: 1, eq: 2 };
      }

      applyTargets(targets) {
        this.applyVisualTargets(targets);
      }

      applyStepState(step) {
        const clamped = clamp(step, 1, this.getStepCount());
        this.queue.clear();
        this.stepIndex = clamped;
        this.applyTargets(this.getStepTargets(clamped));
        notifyVisualUpdate();
      }

      setStep(step, animate = false) {
        const clamped = clamp(step, 1, this.getStepCount());
        if (!animate || this.getReduceMotion()) {
          this.applyStepState(clamped);
          return;
        }
        const start = this.getStepTargets(this.stepIndex);
        const end = this.getStepTargets(clamped);
        this.queue.clear();
        this.queue.run([
          {
            duration: DEFAULT_STEP_MS,
            pause: INTER_STEP_PAUSE_MS,
            onUpdate: (t) => {
              this.applyTargets(this.lerpTargets(start, end, t));
            },
            onEnd: () => {
              this.stepIndex = clamped;
              this.applyTargets(end);
              notifyVisualUpdate();
            }
          }
        ]);
      }

      playAnimation() {
        this.setStep(this.getStepCount(), true);
      }

      tick(dt, dtMs) {
        this.queue.update(dtMs);
        this.orbitPhase += dt;
        if (!this.camera || !this.geo) return;
        // Only force camera position while animation queue is active
        if (this.orbitWeight > 0.001 && this.queue.active) {
          const base = new THREE.Vector3(13, 11, 15);
          const top = new THREE.Vector3(9.4, 15.2, 10.4);
          const blend = clamp(0.45 * this.orbitWeight + Math.sin(this.orbitPhase * 0.8) * 0.05 * this.orbitWeight, 0, 1);
          this.camera.position.lerpVectors(base, top, blend);
          const baseTarget = new THREE.Vector3(0, 0, -this.geo.a * 0.45);
          const slabCentroid = this.slabA.position.clone()
            .add(this.slabAB.position)
            .add(this.slabB.position)
            .multiplyScalar(1 / 3);
          const targetBlend = clamp(0.45 * this.state.explode + 0.4 * this.state.align + 0.7 * this.state.stack, 0, 1);
          const target = baseTarget.clone().lerp(slabCentroid, targetBlend);
          if (this.controls) {
            this.controls.target.lerp(target, 0.12);
          } else {
            this.camera.lookAt(target);
          }
        }
      }

      updateLabels(canvas) {
        labelManager.update(this.camera, canvas, true);
      }

      equationTex() {
        const { a, b } = this.params;
        if (this.equationStage <= 0) {
          return `\\color{${COLOR_HEX.a}}{${a}^3}`;
        }
        if (this.equationStage === 1) {
          return `\\color{${COLOR_HEX.a}}{${a}^3} - \\color{${COLOR_HEX.b}}{${b}^3}`;
        }
        return `\\color{${COLOR_HEX.a}}{${a}^3} - \\color{${COLOR_HEX.b}}{${b}^3} = (${a}-${b})(\\color{${COLOR_HEX.a}}{${a ** 2}}+\\color{${COLOR_HEX.ab}}{${a * b}}+\\color{${COLOR_HEX.b}}{${b ** 2}})`;
      }

      overlay() {
        const messages = [
          "Solid a^3 cube with edge dimensions",
          "Extract the b^3 corner along the diagonal",
          "Cut the L-solid into three slabs in place",
          "Explode slabs along X/Y/Z for separation",
          "Rotate slabs 2 and 3 to align thickness (a-b)",
          "Stack aligned slabs and factor (a-b)"
        ];
        const { a, b } = this.params;
        return {
          left: `Step ${this.stepIndex}/6 | a=${a}, b=${b}`,
          right: messages[this.stepIndex - 1]
        };
      }

      showDrillFeedback(problem) {
        if (problem && problem.a && problem.b) this.setParams({ a: problem.a, b: problem.b });
        this.playAnimation();
      }
    }


    // ===== Drill Engine =====
    class DrillEngine {
      constructor() {
        this.bags = new Map();
        this.recent = new Map();
      }

      bagKey(modeId, level) {
        return `${modeId}-L${level}`;
      }

      generateBank(modeId, level) {
        if (modeId === "prime") return this.buildPrimeBank(level);
        if (modeId === "squares") return this.buildSquaresBank(level);
        if (modeId === "cubes") return this.buildCubesBank(level);
        if (modeId === "ab2") return this.buildAB2Bank(level);
        if (modeId === "diff2") return this.buildDiff2Bank(level);
        if (modeId === "sum3") return this.buildSum3Bank(level);
        if (modeId === "diff3") return this.buildDiff3Bank(level);
        return [];
      }

      draw(modeId, level) {
        const key = this.bagKey(modeId, level);
        if (!this.bags.has(key) || this.bags.get(key).length === 0) {
          this.bags.set(key, shuffle(this.generateBank(modeId, level)));
        }
        const bag = this.bags.get(key);
        const recentKey = `${modeId}-recent`;
        if (!this.recent.has(recentKey)) this.recent.set(recentKey, []);
        const recent = this.recent.get(recentKey);

        let problem = null;
        for (let i = 0; i < 8 && bag.length > 0; i += 1) {
          const candidate = bag.pop();
          if (!recent.includes(candidate.signature)) {
            problem = candidate;
            break;
          }
          bag.unshift(candidate);
        }
        if (!problem) problem = bag.pop();

        recent.push(problem.signature);
        while (recent.length > 3) recent.shift();
        return problem;
      }

      buildPrimeBank(level) {
        const bank = [];
        for (let i = 0; i < 16; i += 1) {
          const type = Math.random() < 0.75 ? "factor" : "inference";
          if (type === "factor") {
            const n = randomCompositeByDifficulty(level);
            bank.push({
              modeId: "prime",
              kind: "prime-factor",
              signature: `pf-${n}`,
              n,
              inputType: "prime",
              promptText: `Find the prime factorization of ${n}.`,
              promptKatex: `${n} = \\;?`,
              answerCanonical: factorizePrimePowers(n),
              explanation: `Prime powers multiply to ${n}.`
            });
          } else {
            const n = randomByDifficulty(level);
            const target = Math.random() < 0.5 ? "square" : "cube";
            const expected = target === "square" ? isPerfectSquare(n) : isPerfectCube(n);
            bank.push({
              modeId: "prime",
              kind: "prime-inference",
              signature: `pi-${target}-${n}`,
              n,
              target,
              inputType: "yesno",
              promptText: `From prime exponents, is ${n} a perfect ${target}?`,
              promptKatex: `${n}`,
              answer: expected ? "yes" : "no",
              explanation: target === "square"
                ? "All prime exponents must be even for a perfect square."
                : "All prime exponents must be multiples of 3 for a perfect cube."
            });
          }
        }
        return bank;
      }

      buildSquaresBank(level) {
        const bank = [];
        for (let i = 0; i < 16; i += 1) {
          if (Math.random() < 0.6) {
            const n = randomByDifficulty(level);
            const perfect = isPerfectSquare(n);
            bank.push({
              modeId: "squares",
              kind: "square-check",
              signature: `sq-check-${n}`,
              n,
              inputType: "text",
              promptText: `What is the side length of a square with area ${n}? (Enter a whole number, or "none")`,
              promptKatex: `\\text{Area }= ${n}`,
              answer: { perfect, root: perfect ? Math.sqrt(n) : null },
              explanation: perfect
                ? `${n} = ${Math.sqrt(n)}^2.`
                : `${n} is between ${Math.floor(Math.sqrt(n))}^2 and ${Math.ceil(Math.sqrt(n))}^2.`
            });
          } else {
            const n = randomByDifficulty(level);
            const nearest = nearestPerfectSquare(n);
            bank.push({
              modeId: "squares",
              kind: "closest-square",
              signature: `sq-near-${n}`,
              n,
              inputType: "number",
              promptText: `Which perfect square is closest to ${n}?`,
              promptKatex: `${n}`,
              answer: nearest.nearest,
              explanation: `${nearest.lowSq} and ${nearest.highSq} bound ${n}; nearest is ${nearest.nearest}.`
            });
          }
        }
        return bank;
      }

      buildCubesBank(level) {
        const bank = [];
        for (let i = 0; i < 16; i += 1) {
          const n = randomByDifficulty(level);
          const perfect = isPerfectCube(n);
          bank.push({
            modeId: "cubes",
            kind: "cube-check",
            signature: `cube-check-${n}`,
            n,
            inputType: "text",
            promptText: `What is the edge length of a cube with volume ${n}? (Enter a whole number, or "none")`,
            promptKatex: `\\text{Volume }= ${n}`,
            answer: { perfect, root: perfect ? Math.round(Math.cbrt(n)) : null },
            explanation: perfect ? `${n} = ${Math.round(Math.cbrt(n))}^3.` : `${n} is not an integer cube.`
          });
        }
        return bank;
      }

      buildAB2Bank(level) {
        const bank = [];
        for (let i = 0; i < 16; i += 1) {
          const { a, b } = randomABForDiff(level, 10);
          const kindChoice = randInt(0, 2);
          if (kindChoice === 0) {
            bank.push({
              modeId: "ab2",
              kind: "ab2-value",
              signature: `ab2-value-${a}-${b}`,
              a,
              b,
              inputType: "number",
              promptText: `Given a=${a}, b=${b}, evaluate (a+b)^2.`,
              promptKatex: `(${a}+${b})^2`,
              answer: (a + b) ** 2,
              explanation: `(a+b)^2 = a^2 + 2ab + b^2 = ${a ** 2} + ${2 * a * b} + ${b ** 2}.`
            });
          } else if (kindChoice === 1) {
            bank.push({
              modeId: "ab2",
              kind: "ab2-area",
              signature: `ab2-ab-${a}-${b}`,
              a,
              b,
              inputType: "number",
              promptText: `Given a=${a}, b=${b}, what is the area of one ab region?`,
              promptKatex: `${a}\\cdot${b}`,
              answer: a * b,
              explanation: `Each green rectangle has area a*b = ${a * b}.`
            });
          } else {
            const correct = `${a ** 2}+${2 * a * b}+${b ** 2}`;
            const options = shuffle([
              correct,
              `${a ** 2}+${a * b}+${b ** 2}`,
              `${a ** 2}-${2 * a * b}+${b ** 2}`,
              `${(a + b) ** 2}`
            ]);
            bank.push({
              modeId: "ab2",
              kind: "ab2-expand",
              signature: `ab2-expand-${a}-${b}`,
              a,
              b,
              inputType: "mc",
              promptText: `Expand (a+b)^2 for a=${a}, b=${b}.`,
              promptKatex: `(${a}+${b})^2`,
              options,
              answer: correct,
              explanation: `Middle term is 2ab, so ${correct}.`
            });
          }
        }
        return bank;
      }

      buildDiff2Bank(level) {
        const bank = [];
        for (let i = 0; i < 16; i += 1) {
          let a;
          let b;
          if (level === 1) {
            a = randInt(3, 6);
            b = randInt(1, a - 1);
          } else if (level === 2) {
            a = randInt(5, 8);
            b = randInt(1, a - 1);
          } else {
            a = randInt(7, 10);
            b = randInt(2, a - 1);
          }
          if (Math.random() < 0.55) {
            bank.push({
              modeId: "diff2",
              kind: "diff2-dims",
              signature: `d2-dims-${a}-${b}`,
              a,
              b,
              inputType: "pair",
              promptText: `For a=${a}, b=${b}, give the dimensions of (a+b)(a-b).`,
              promptKatex: `${a}^2-${b}^2`,
              answerPair: [a + b, a - b].sort((x, y) => x - y),
              explanation: `Difference of squares factors to (${a}+${b})(${a}-${b}).`
            });
          } else {
            const correct = `${a + b}x${a - b}`;
            const options = shuffle([
              correct,
              `${a - b}x${a - b}`,
              `${a + b}x${a + b}`,
              `${a * b}`
            ]);
            bank.push({
              modeId: "diff2",
              kind: "diff2-factor-mc",
              signature: `d2-mc-${a}-${b}`,
              a,
              b,
              inputType: "mc",
              promptText: `Choose the correct factor dimensions for ${a}^2-${b}^2.`,
              promptKatex: `${a}^2-${b}^2`,
              options,
              answer: correct,
              explanation: "Always (a+b)(a-b)."
            });
          }
        }
        return bank;
      }

      buildSum3Bank(level) {
        const bank = [];
        for (let i = 0; i < 16; i += 1) {
          let a;
          let b;
          if (level === 1) {
            a = randInt(1, 3);
            b = randInt(1, 3);
          } else if (level === 2) {
            a = randInt(2, 5);
            b = randInt(2, 5);
          } else {
            a = randInt(3, 6);
            b = randInt(2, 6);
          }
          const correct = `(${a}+${b})(${a ** 2}-${a * b}+${b ** 2})`;
          const options = shuffle([
            correct,
            `(${a}+${b})(${a ** 2}+${a * b}+${b ** 2})`,
            `(${a}-${b})(${a ** 2}-${a * b}+${b ** 2})`,
            `${(a + b) ** 3}`
          ]);
          bank.push({
            modeId: "sum3",
            kind: "sum3-factor",
            signature: `sum3-${a}-${b}`,
            a,
            b,
            inputType: "mc",
            promptText: `Factor ${a}^3+${b}^3 using the identity.`,
            promptKatex: `${a}^3+${b}^3`,
            options,
            answer: correct,
            explanation: "Sum of cubes uses (a+b)(a^2-ab+b^2)."
          });
        }
        return bank;
      }

      buildDiff3Bank(level) {
        const bank = [];
        for (let i = 0; i < 16; i += 1) {
          let a;
          let b;
          if (level === 1) {
            a = randInt(2, 4);
            b = randInt(1, a - 1);
          } else if (level === 2) {
            a = randInt(3, 5);
            b = randInt(1, a - 1);
          } else {
            a = randInt(4, 6);
            b = randInt(1, a - 1);
          }
          const correct = `(${a}-${b})(${a ** 2}+${a * b}+${b ** 2})`;
          const options = shuffle([
            correct,
            `(${a}-${b})(${a ** 2}-${a * b}+${b ** 2})`,
            `(${a}+${b})(${a ** 2}+${a * b}+${b ** 2})`,
            `${(a - b) ** 3}`
          ]);
          bank.push({
            modeId: "diff3",
            kind: "diff3-factor",
            signature: `diff3-${a}-${b}`,
            a,
            b,
            inputType: "mc",
            promptText: `Factor ${a}^3-${b}^3 using the identity.`,
            promptKatex: `${a}^3-${b}^3`,
            options,
            answer: correct,
            explanation: "Difference of cubes uses (a-b)(a^2+ab+b^2)."
          });
        }
        return bank;
      }
    }

    function defaultProgress() {
      return {
        version: STORAGE_VERSION,
        updatedAt: Date.now(),
        global: { attempts: 0, correct: 0 },
        prefs: { reduceMotion: false },
        modes: Object.fromEntries(modeIds.map((id) => [
          id,
          { attempts: 0, correct: 0, bestStreak: 0, difficulty: 1 }
        ]))
      };
    }

    function loadProgress() {
      const fallback = defaultProgress();
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") return fallback;
        const merged = defaultProgress();
        merged.global = { ...merged.global, ...(parsed.global || {}) };
        merged.prefs = { ...merged.prefs, ...(parsed.prefs || {}) };
        for (const id of modeIds) {
          merged.modes[id] = { ...merged.modes[id], ...((parsed.modes || {})[id] || {}) };
          merged.modes[id].difficulty = clamp(Number(merged.modes[id].difficulty) || 1, 1, 3);
        }
        return merged;
      } catch (error) {
        return fallback;
      }
    }

    function saveProgress() {
      try {
        appState.progress.updatedAt = Date.now();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState.progress));
      } catch (error) {
        // Ignore write failures.
      }
    }

      diff2: new DiffSquaresMode(() => appState.reduceMotion),

    };

    function renderTabs() {

    function getControlMax(control, params) {
      if (typeof control.dynamicMax === "function") return control.dynamicMax(params);
      return control.max;
    }

    function renderControls() {
      const def = modeMap[appState.activeModeId];
      const params = appState.params[appState.activeModeId];
      dom.exploreControls.innerHTML = "";

      for (const control of def.controls) {
        const max = getControlMax(control, params);
        if (params[control.key] > max) params[control.key] = max;
        if (params[control.key] < control.min) params[control.key] = control.min;

        const row = document.createElement("div");
        row.className = "control";

        const label = document.createElement("label");
        label.setAttribute("for", `ctrl-${control.key}`);
        label.textContent = `${control.label} (${control.min}-${max})`;

        const input = document.createElement("input");
        input.type = "range";
        input.id = `ctrl-${control.key}`;
        input.min = String(control.min);
        input.max = String(max);
        input.step = String(control.step ?? 1);
        input.value = String(params[control.key]);

        const valueText = document.createElement("div");
        valueText.className = "control-value";
        valueText.textContent = `${params[control.key]}`;

        input.addEventListener("input", () => {
          const value = Number.parseInt(input.value, 10);
          params[control.key] = value;
          if (appState.activeModeId === "diff2" || appState.activeModeId === "diff3") {
            const bControl = def.controls.find((c) => c.key === "b");
            if (bControl) {
              const bMax = getControlMax(bControl, params);
              params.b = clamp(params.b, bControl.min, bMax);
            }
          }
          valueText.textContent = `${params[control.key]}`;
          modeImpl[appState.activeModeId].setParams(params);
          refreshEquation();
          refreshOverlay();
          if (control.dynamicMax || control.key === "a") renderControls();
        });

        row.append(label, input, valueText);
        dom.exploreControls.appendChild(row);
      }
    }

    function clearStepAutoplay() {
      if (appState.step.autoplayTimer) {
        window.clearTimeout(appState.step.autoplayTimer);
        appState.step.autoplayTimer = 0;
      }
    }

    function getActiveStepMode() {
      const mode = modeImpl[appState.activeModeId];
      if (!mode || !mode.hasStepControls || !mode.hasStepControls()) return null;
      return mode;
    }

    function getStepPacingMs() {
      if (appState.reduceMotion) return { duration: REDUCED_STEP_MS, pause: 0 };
      return { duration: DEFAULT_STEP_MS, pause: INTER_STEP_PAUSE_MS };
    }

    function refreshStepControls() {
      const mode = getActiveStepMode();
      if (!mode) {
        dom.stepControls.classList.add("hidden");
        dom.stepCounter.textContent = "Step 1 / 1";
        dom.stepPrevBtn.disabled = true;
        dom.stepNextBtn.disabled = true;
        return;
      }
      dom.stepControls.classList.remove("hidden");
      const total = Math.max(1, Number(mode.getStepCount?.() ?? 1));
      const index = clamp(Number(mode.getStepIndex?.() ?? 1), 1, total);
      appState.step.indexByMode[appState.activeModeId] = index;
      dom.stepCounter.textContent = `Step ${index} / ${total}`;
      dom.stepPrevBtn.disabled = index <= 1;
      dom.stepNextBtn.disabled = index >= total;
    }

    function stepMode(delta) {
      clearStepAutoplay();
      const mode = getActiveStepMode();
      if (!mode) return;
      const current = mode.getStepIndex();
      const target = clamp(current + delta, 1, mode.getStepCount());
      if (target === current) {
        refreshStepControls();
        return;
      }
      mode.setStep(target, delta > 0);
      refreshStepControls();
      const { duration, pause } = getStepPacingMs();
      window.setTimeout(refreshStepControls, duration + pause + 20);
    }

    function playRemainingSteps() {
      clearStepAutoplay();
      const mode = getActiveStepMode();
      if (!mode) return;

      const tick = () => {
        const active = getActiveStepMode();
        if (!active || active !== mode) {
          clearStepAutoplay();
          return;
        }
        const current = active.getStepIndex();
        const total = active.getStepCount();
        if (current >= total) {
          clearStepAutoplay();
          refreshStepControls();
          return;
        }
        active.setStep(current + 1, true);
        refreshStepControls();
        const { duration, pause } = getStepPacingMs();
        appState.step.autoplayTimer = window.setTimeout(tick, duration + pause + 24);
      };

      tick();
    }

        return;
      }

      if (problem.inputType === "prime" || problem.inputType === "text" || problem.inputType === "pair") {

    function renderProblem(problem) {
      if (!problem) {
        dom.questionText.textContent = "No problem available.";
        dom.questionKatex.textContent = "";
        dom.answerArea.innerHTML = "";
        return;
      }
      dom.questionText.textContent = problem.promptText || "";
      renderKatex(dom.questionKatex, problem.promptKatex || "", false);
      renderAnswerInputs(problem);
    }

    function gradeProblem(problem, draft) {
      if (!problem) return { valid: false, correct: false, message: "No problem loaded." };

      if (problem.inputType === "number") {
        const value = Number.parseFloat(draft.number);
        if (Number.isNaN(value)) return { valid: false, correct: false, message: "Enter a numeric answer." };
        const correct = nearlyEqual(value, Number(problem.answer));
        return { valid: true, correct, message: correct ? "Correct." : `Incorrect. Correct answer: ${problem.answer}.` };
      }

      if (problem.inputType === "prime") {
        const parsed = parsePrimeFactorInput(draft.text || "");
        if (!parsed) return { valid: false, correct: false, message: `Use one of the two accepted forms. ${PRIME_PARSE_FORMATS}` };
        const correct = areFactorizationsEqual(parsed, problem.answerCanonical);
        return {
          valid: true,
          correct,
          message: correct
            ? "Correct prime factorization."
            : `Incorrect. Expected factors: ${problem.answerCanonical.map(([p, e]) => `${p}${e > 1 ? `^${e}` : ""}`).join(" * ")}.`
        };
      }

      if (problem.inputType === "text") {
        const text = (draft.text || "").trim();
        if (!text) return { valid: false, correct: false, message: "Enter an answer." };
        if (problem.answer && typeof problem.answer === "object" && Object.hasOwn(problem.answer, "perfect")) {
          const normalized = text.toLowerCase();
          const asNumber = Number.parseInt(text, 10);
          if (normalized === "none") {
            const correct = !problem.answer.perfect;
            return {
              valid: true,
              correct,
              message: correct
                ? "Correct."
                : `Incorrect. This value is a perfect power with root ${problem.answer.root}.`
            };
          }
          if (!/^[-]?\d+$/.test(text)) {
            return { valid: false, correct: false, message: "Enter a whole number or \"none\"." };
          }
          const correct = problem.answer.perfect && asNumber === problem.answer.root;
          return {
            valid: true,
            correct,
            message: correct
              ? "Correct."
              : (problem.answer.perfect
                ? `Incorrect. The whole-number root is ${problem.answer.root}.`
                : "Incorrect. This value is not a perfect power, so enter \"none\".")
          };
        }
        const correct = text.toLowerCase() === String(problem.answer).toLowerCase();
        return { valid: true, correct, message: correct ? "Correct." : `Incorrect. Expected: ${problem.answer}.` };
      }

      if (problem.inputType === "pair") {
        const parsed = parsePairInput(draft.text || "");
        if (!parsed) return { valid: false, correct: false, message: "Enter two numbers like 10,4 or 10x4." };
        const expected = problem.answerPair.slice().sort((a, b) => a - b);
        const correct = parsed[0] === expected[0] && parsed[1] === expected[1];
        return { valid: true, correct, message: correct ? "Correct dimensions." : `Incorrect. Dimensions are ${expected[1]} and ${expected[0]}.` };
      }

      if (problem.inputType === "yesno") {
        const choiceValue = draft.choice;
        if (!choiceValue) return { valid: false, correct: false, message: "Choose YES or NO." };
        const correct = choiceValue === problem.answer;
        return { valid: true, correct, message: correct ? "Correct." : `Incorrect. Answer is ${String(problem.answer).toUpperCase()}.` };
      }

      if (problem.inputType === "mc") {
        const selected = draft.choice;
        if (!selected) return { valid: false, correct: false, message: "Select an option." };
        const correct = selected === problem.answer;
        return { valid: true, correct, message: correct ? "Correct choice." : `Incorrect. Correct choice: ${problem.answer}.` };
      }

      return { valid: false, correct: false, message: "Unsupported input type." };
    }

    function pullCurrentProblem(modeId) {

    function loadNextProblem(modeId = appState.activeModeId) {
      const stat = getModeStat(modeId);

    function updateDifficulty(modeId, correct) {
      const stat = getModeStat(modeId);
      const runtime = appState.runtime[modeId];
      runtime.recent.push(correct);
      while (runtime.recent.length > 3) runtime.recent.shift();
      runtime.consecutiveCorrect = correct ? runtime.consecutiveCorrect + 1 : 0;
      let levelMessage = "";
      if (runtime.consecutiveCorrect >= 3 && stat.difficulty < 3) {
        stat.difficulty += 1;
        runtime.consecutiveCorrect = 0;
        runtime.recent = [];
        levelMessage = ` Level up -> L${stat.difficulty}.`;
      } else if (!correct) {
        const wrongCount = runtime.recent.filter((v) => !v).length;
        if (wrongCount >= 2 && stat.difficulty > 1) {
          stat.difficulty -= 1;
          runtime.recent = [];
          runtime.consecutiveCorrect = 0;
          levelMessage = ` Level down -> L${stat.difficulty}.`;
        }
      }
      return levelMessage;
    }

    function onCheckAnswer() {
      const modeId = appState.activeModeId;
      const problem = pullCurrentProblem(modeId);
      if (!problem) return;

      const result = gradeProblem(problem, appState.answerDraft);
      if (!result.valid) {
        showFeedback(false, result.message);
        return;
      }

      const stat = getModeStat(modeId);
      const runtime = appState.runtime[modeId];
      stat.attempts += 1;
      appState.progress.global.attempts += 1;
      if (result.correct) {
        stat.correct += 1;
        appState.progress.global.correct += 1;
        runtime.streak += 1;
        stat.bestStreak = Math.max(stat.bestStreak, runtime.streak);
      } else {
        runtime.streak = 0;
      }

      const levelMessage = updateDifficulty(modeId, result.correct);
      const explanation = problem.explanation ? ` ${problem.explanation}` : "";
      showFeedback(result.correct, `${result.message}${explanation}${levelMessage}`);
      refreshStreakDots();
      refreshDifficultyPill();
      refreshStatsModal();
      saveProgress();

      const active = modeImpl[modeId];
      if (active && active.showDrillFeedback) active.showDrillFeedback(problem, result);
      refreshOverlay();
    }

    function refreshStatsModal() {
      const g = appState.progress.global;
      dom.globalStats.innerHTML = [
        "<strong>Global Accuracy</strong>",
        `Attempts: ${g.attempts}`,
        `Correct: ${g.correct}`,
        `Accuracy: ${safePercent(g.correct, g.attempts)}%`,
        `<div class="muted">Difficulty ranges: L1 2-30, L2 30-200, L3 200-1000 (tricky: 441, 729).</div>`
      ].join("<br>");

      dom.modeStats.innerHTML = "";
      for (const def of MODE_DEFS) {
        const m = appState.progress.modes[def.id];
        const card = document.createElement("div");
        card.className = "stats-item";
        card.innerHTML = [
          `<strong>${def.label}</strong>`,
          `Attempts: ${m.attempts}`,
          `Correct: ${m.correct}`,
          `Accuracy: ${safePercent(m.correct, m.attempts)}%`,
          `Best streak: ${m.bestStreak}`,
          `Current level: L${m.difficulty}`
        ].join("<br>");
        dom.modeStats.appendChild(card);
      }
    }

    function setActiveMode(modeId) {
      if (!modeMap[modeId]) return;
      clearStepAutoplay();
      labelManager.clear();
      appState.activeModeId = modeId;
      renderTabs();
      refreshDifficultyPill();
      refreshStreakDots();

      if (modeId === "prime") {
        dom.treeCanvas.style.display = "block";
        sceneManager.renderer.domElement.style.display = "none";
      } else {
        dom.treeCanvas.style.display = "none";
        sceneManager.renderer.domElement.style.display = "block";
      }

      sceneManager.setMode(modeImpl[modeId]);
      modeImpl[modeId].setParams(appState.params[modeId]);
      renderControls();
      refreshEquation();
      refreshOverlay();
      if (!appState.currentProblemByMode[modeId]) loadNextProblem(modeId);
      renderProblem(appState.currentProblemByMode[modeId]);
      clearFeedback();
      refreshStepControls();
    }

    function wireHeaderAndModal() {
      dom.reduceMotionToggle.addEventListener("change", () => {
        appState.reduceMotion = dom.reduceMotionToggle.checked;
        appState.progress.prefs.reduceMotion = appState.reduceMotion;
        saveProgress();
      });
      dom.statsBtn.addEventListener("click", () => {
        refreshStatsModal();
        dom.statsModal.classList.add("open");
      });
      dom.closeStatsBtn.addEventListener("click", () => {
        dom.statsModal.classList.remove("open");
      });
      dom.statsModal.addEventListener("click", (event) => {
        if (event.target === dom.statsModal) dom.statsModal.classList.remove("open");
      });
    }

    function wireExploreButtons() {
      dom.playBtn.addEventListener("click", () => {
        const mode = modeImpl[appState.activeModeId];
        if (mode && mode.hasStepControls && mode.hasStepControls()) {
          playRemainingSteps();
          return;
        }
        if (mode.playAnimation) mode.playAnimation();
      });
      dom.resetBtn.addEventListener("click", () => {
        clearStepAutoplay();
        const def = modeMap[appState.activeModeId];
        appState.params[appState.activeModeId] = { ...def.defaultParams };
        modeImpl[appState.activeModeId].resetExplore();
        renderControls();
        refreshEquation();
        refreshOverlay();
        refreshStepControls();
      });
    }

    function wireStepButtons() {
      dom.stepPrevBtn.addEventListener("click", () => {
        stepMode(-1);
      });
      dom.stepNextBtn.addEventListener("click", () => {
        stepMode(1);
      });
      dom.stepPlayBtn.addEventListener("click", () => {
        playRemainingSteps();
      });
    }

    function wireDrillButtons() {
      dom.checkBtn.addEventListener("click", onCheckAnswer);
      dom.nextBtn.addEventListener("click", () => {
        loadNextProblem(appState.activeModeId);
        refreshOverlay();
      });
    }

    function initialize() {
      appState.progress = loadProgress();
      appState.reduceMotion = !!appState.progress.prefs.reduceMotion;
      dom.reduceMotionToggle.checked = appState.reduceMotion;

      for (const id of modeIds) {
        const defaultLevel = appState.progress.modes[id].difficulty;
        appState.progress.modes[id].difficulty = clamp(defaultLevel, 1, 3);
      }

      wireHeaderAndModal();
      wireExploreButtons();
      wireStepButtons();
      wireDrillButtons();
      window.addEventListener("mathviz-mode-update", () => {
        refreshEquation();
        refreshOverlay();
        refreshStepControls();
      });
      renderTabs();
      refreshStatsModal();
      setActiveMode(appState.activeModeId);
    }

    initialize();
  </script>
</body>
</html>
