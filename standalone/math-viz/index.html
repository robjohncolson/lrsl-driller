<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math Foundations Visualizer & Drill</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      --bg: #1a1a2e;
      --panel: #0f0f23;
      --panel-2: #141433;
      --text: #e8e8e8;
      --muted: #6b7280;
      --accent: #7c3aed;
      --a: #58c4dd;
      --b: #fcba03;
      --ab: #83c167;
      --result: #ff6b6b;
      --prime: #58c4dd;
      --composite: #a9a9a9;
      --ok: #83c167;
      --bad: #ff6b6b;
      --edge: rgba(255, 255, 255, 0.08);
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: radial-gradient(circle at 20% 20%, #25254a 0%, var(--bg) 40%, #111120 100%);
      color: var(--text);
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 14px 14px 20px;
      display: grid;
      gap: 12px;
    }

    .topbar {
      display: grid;
      gap: 10px;
      background: linear-gradient(160deg, rgba(19, 19, 46, 0.98), rgba(15, 15, 35, 0.98));
      border: 1px solid var(--edge);
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: var(--shadow);
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand p {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      color: var(--text);
      background: rgba(124, 58, 237, 0.15);
      border: 1px solid rgba(124, 58, 237, 0.4);
      border-radius: 999px;
      padding: 7px 11px;
      min-height: 44px;
    }

    .toggle input {
      accent-color: var(--accent);
    }

    .stats-btn {
      min-height: 44px;
      padding: 8px 14px;
      border: 1px solid rgba(124, 58, 237, 0.6);
      background: linear-gradient(180deg, rgba(124, 58, 237, 0.35), rgba(124, 58, 237, 0.2));
      color: var(--text);
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-btn {
      min-height: 44px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      padding: 8px 13px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: all 120ms ease;
    }

    .tab-btn:hover {
      border-color: rgba(124, 58, 237, 0.6);
      background: rgba(124, 58, 237, 0.2);
    }

    .tab-btn.active {
      background: linear-gradient(180deg, rgba(124, 58, 237, 0.45), rgba(124, 58, 237, 0.22));
      border-color: rgba(124, 58, 237, 0.75);
      box-shadow: 0 0 0 1px rgba(124, 58, 237, 0.3) inset;
    }

    .workspace {
      display: grid;
      gap: 12px;
    }

    .viz-drill-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 12px;
      min-height: 430px;
    }

    .panel {
      background: linear-gradient(170deg, rgba(20, 20, 51, 0.95), rgba(15, 15, 35, 0.96));
      border: 1px solid var(--edge);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .viz-panel {
      position: relative;
      overflow: hidden;
      min-height: 430px;
      display: flex;
    }

    .viz-wrapper {
      position: relative;
      width: 100%;
      min-height: 430px;
    }

    .render-root {
      position: absolute;
      inset: 0;
      min-height: 430px;
    }

    .tree-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
    }

    .label-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 2;
    }

    .viz-label {
      position: absolute;
      transform: translate(-50%, -50%);
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.2s ease;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.55);
    }

    .viz-label--large {
      font-size: 1.6rem;
      font-weight: 800;
    }

    .viz-label--medium {
      font-size: 1.1rem;
    }

    .viz-label--dim {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .viz-overlay {
      position: absolute;
      left: 12px;
      top: 12px;
      right: 12px;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      flex-wrap: wrap;
    }

    .overlay-chip {
      pointer-events: auto;
      font-size: 0.8rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(10, 10, 30, 0.7);
      border-radius: 999px;
      padding: 6px 10px;
    }

    .drill-panel {
      padding: 12px;
      display: grid;
      grid-template-rows: auto auto auto 1fr auto auto auto;
      gap: 10px;
      min-height: 430px;
    }

    .panel-title-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .panel-title {
      margin: 0;
      font-size: 0.96rem;
      letter-spacing: 0.02em;
    }

    .difficulty-pill {
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 700;
      color: #0d1025;
      background: linear-gradient(180deg, #d5c9ff, #a487ff);
    }

    .question-katex {
      min-height: 44px;
      border: 1px dashed rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      padding: 8px;
      background: rgba(255, 255, 255, 0.02);
      overflow: auto;
    }

    .question-text {
      color: var(--text);
      line-height: 1.35;
      font-size: 0.92rem;
      min-height: 44px;
    }

    .answer-area {
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px;
      display: grid;
      gap: 10px;
      align-content: start;
      background: rgba(255, 255, 255, 0.02);
    }

    .answer-text,
    .answer-number {
      width: 100%;
      min-height: 44px;
      border-radius: 9px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(10, 10, 25, 0.8);
      color: var(--text);
      padding: 10px;
    }

    .answer-options {
      display: grid;
      gap: 8px;
    }

    .answer-option {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      cursor: pointer;
      min-height: 44px;
      background: rgba(255, 255, 255, 0.02);
    }

    .yesno-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .yesno-btn {
      min-width: 96px;
      min-height: 44px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
    }

    .yesno-btn.selected {
      border-color: rgba(124, 58, 237, 0.8);
      background: rgba(124, 58, 237, 0.35);
    }

    .drill-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 44px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn.primary {
      border-color: rgba(124, 58, 237, 0.8);
      background: linear-gradient(180deg, rgba(124, 58, 237, 0.5), rgba(124, 58, 237, 0.24));
    }

    .feedback {
      min-height: 46px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.03);
      line-height: 1.3;
      font-size: 0.88rem;
    }

    .feedback.ok {
      border-color: rgba(131, 193, 103, 0.65);
      color: var(--ok);
      background: rgba(131, 193, 103, 0.12);
    }

    .feedback.bad {
      border-color: rgba(255, 107, 107, 0.65);
      color: var(--bad);
      background: rgba(255, 107, 107, 0.1);
    }

    .streak-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.84rem;
      color: var(--muted);
    }

    .streak-dots {
      letter-spacing: 0.08em;
      font-size: 1rem;
      color: var(--text);
      font-family: "Consolas", "Menlo", monospace;
    }

    .explore-panel {
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: start;
    }

    .controls-grid {
      display: grid;
      gap: 9px;
    }

    .control {
      display: grid;
      grid-template-columns: 110px 1fr 58px;
      gap: 8px;
      align-items: center;
    }

    .control label {
      color: var(--muted);
      font-size: 0.84rem;
    }

    .control input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .control-value {
      text-align: right;
      font-family: "Consolas", "Menlo", monospace;
      font-size: 0.85rem;
    }

    .explore-right {
      display: grid;
      gap: 8px;
      min-width: 265px;
    }

    .equation-card {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 10px;
      min-height: 68px;
      background: rgba(255, 255, 255, 0.02);
      overflow: auto;
    }

    .explore-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .step-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 0 2px;
      border-top: 1px dashed rgba(255, 255, 255, 0.14);
    }

    .step-counter {
      min-width: 92px;
      text-align: center;
      font-size: 0.84rem;
      color: var(--muted);
      font-weight: 700;
    }

    .step-btn {
      min-width: 44px;
      min-height: 44px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
    }

    .step-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .stats-modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(2, 3, 14, 0.7);
      z-index: 30;
      padding: 14px;
    }

    .stats-modal.open {
      display: grid;
    }

    .stats-card {
      width: min(900px, 100%);
      max-height: 90vh;
      overflow: auto;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: linear-gradient(170deg, rgba(20, 20, 51, 0.98), rgba(15, 15, 35, 0.99));
      box-shadow: var(--shadow);
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .stats-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 10px;
    }

    .stats-item {
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.02);
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .stats-item strong {
      color: var(--text);
      display: block;
      margin-bottom: 6px;
    }

    .muted {
      color: var(--muted);
    }

    .hidden {
      display: none !important;
    }

    .legend-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.78rem;
    }

    .legend-chip {
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 5px 10px;
      background: rgba(255, 255, 255, 0.03);
    }

    @media (max-width: 1100px) {
      .viz-drill-grid {
        grid-template-columns: minmax(0, 1fr) 330px;
      }
    }

    @media (max-width: 900px) {
      .explore-panel {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 768px) {
      .viz-drill-grid {
        grid-template-columns: 1fr;
      }

      .viz-panel,
      .drill-panel {
        min-height: 360px;
      }

      .render-root {
        min-height: 360px;
      }
    }

    @media (max-width: 480px) {
      .control {
        grid-template-columns: 1fr;
      }

      .control-value {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar panel">
      <div class="brand-row">
        <div class="brand">
          <h1>Math Foundations Visualizer & Drill</h1>
          <p>Prime factors, perfect powers, and cube/binomial identities</p>
        </div>
        <div class="header-actions">
          <label class="toggle">
            <input id="reduceMotionToggle" type="checkbox">
            Reduce Motion
          </label>
          <button id="statsBtn" class="stats-btn" type="button">Stats</button>
        </div>
      </div>
      <nav id="modeTabs" class="tabs" aria-label="Modes"></nav>
    </header>

    <main class="workspace">
      <section class="viz-drill-grid">
        <section class="viz-panel panel">
          <div id="vizWrapper" class="viz-wrapper">
            <div id="renderRoot" class="render-root"></div>
            <canvas id="factorTreeCanvas" class="tree-canvas" aria-label="Prime factor tree"></canvas>
            <div id="labelLayer" class="label-layer"></div>
          </div>
          <div id="vizOverlay" class="viz-overlay">
            <div id="overlayLeft" class="overlay-chip">Mode Ready</div>
            <div id="overlayRight" class="overlay-chip">30+ FPS target</div>
          </div>
        </section>

        <aside class="drill-panel panel">
          <div class="panel-title-row">
            <h2 class="panel-title">Drill Panel</h2>
            <span id="difficultyPill" class="difficulty-pill">L1</span>
          </div>

          <div id="questionKatex" class="question-katex"></div>
          <div id="questionText" class="question-text"></div>
          <div id="answerArea" class="answer-area"></div>

          <div class="drill-actions">
            <button id="checkBtn" class="btn primary" type="button">Check</button>
            <button id="nextBtn" class="btn" type="button">Next Problem</button>
          </div>

          <div id="feedback" class="feedback" aria-live="polite">Pick a mode and solve your first problem.</div>

          <div class="streak-row">
            <span>Streak</span>
            <span id="streakDots" class="streak-dots">○○○○○</span>
          </div>
        </aside>
      </section>

      <section class="explore-panel panel">
        <div id="exploreControls" class="controls-grid"></div>
        <div class="explore-right">
          <div id="equationCard" class="equation-card"></div>
          <div class="explore-actions">
            <button id="playBtn" class="btn primary" type="button">Play All</button>
            <button id="resetBtn" class="btn" type="button">Reset</button>
          </div>
          <div id="stepControls" class="step-controls hidden">
            <button id="stepPrevBtn" class="step-btn" type="button" title="Previous step">‹</button>
            <span id="stepCounter" class="step-counter">Step 1 / 1</span>
            <button id="stepNextBtn" class="step-btn" type="button" title="Next step">›</button>
            <button id="stepPlayBtn" class="step-btn" type="button" title="Play all">▶</button>
          </div>
          <div class="legend-row">
            <span class="legend-chip">a: <span style="color:var(--a)">#58c4dd</span></span>
            <span class="legend-chip">ab: <span style="color:var(--ab)">#83c167</span></span>
            <span class="legend-chip">b: <span style="color:var(--b)">#fcba03</span></span>
            <span class="legend-chip">result: <span style="color:var(--result)">#ff6b6b</span></span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <div id="statsModal" class="stats-modal" role="dialog" aria-modal="true" aria-labelledby="statsTitle">
    <div class="stats-card">
      <div class="stats-header">
        <h2 id="statsTitle" style="margin:0">MathViz Stats</h2>
        <button id="closeStatsBtn" class="btn" type="button">Close</button>
      </div>
      <div id="globalStats" class="stats-item"></div>
      <div id="modeStats" class="stats-grid"></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // ===== Constants =====
    const STORAGE_KEY = "mathVizDriller";
    const STORAGE_VERSION = 1;
    const DEFAULT_STEP_MS = 400;
    const INTER_STEP_PAUSE_MS = 200;
    const REDUCED_STEP_MS = 80;
    const PRIME_PARSE_FORMATS = "Accepted: 2^3 * 3^2 * 5 or 2 * 2 * 2 * 3 * 3 * 5";

    const COLOR_HEX = {
      background: "#1a1a2e",
      panel: "#0f0f23",
      a: "#58c4dd",
      b: "#fcba03",
      ab: "#83c167",
      result: "#ff6b6b",
      prime: "#58c4dd",
      composite: "#a9a9a9",
      accent: "#7c3aed",
      text: "#e8e8e8",
      muted: "#6b7280"
    };

    const COLOR_NUM = {
      background: 0x1a1a2e,
      a: 0x58c4dd,
      b: 0xfcba03,
      ab: 0x83c167,
      result: 0xff6b6b,
      prime: 0x58c4dd,
      composite: 0xa9a9a9
    };

    const DIFFICULTY_RANGES = {
      1: [2, 30],
      2: [30, 200],
      3: [200, 1000]
    };

    const MODE_DEFS = [
      {
        id: "prime",
        label: "Prime Factorization",
        controls: [
          { key: "number", label: "Number N", min: 2, max: 500, step: 1 }
        ],
        defaultParams: { number: 84 }
      },
      {
        id: "squares",
        label: "Perfect Squares",
        controls: [
          { key: "n", label: "n", min: 1, max: 20, step: 1 }
        ],
        defaultParams: { n: 8 }
      },
      {
        id: "cubes",
        label: "Perfect Cubes",
        controls: [
          { key: "n", label: "n", min: 1, max: 12, step: 1 }
        ],
        defaultParams: { n: 5 }
      },
      {
        id: "ab2",
        label: "(a+b)^2",
        controls: [
          { key: "a", label: "a", min: 1, max: 10, step: 1 },
          { key: "b", label: "b", min: 1, max: 10, step: 1 }
        ],
        defaultParams: { a: 4, b: 3 }
      },
      {
        id: "diff2",
        label: "a^2-b^2",
        controls: [
          { key: "a", label: "a", min: 2, max: 10, step: 1 },
          { key: "b", label: "b", min: 1, max: 9, step: 1, dynamicMax: (params) => Math.max(1, params.a - 1) }
        ],
        defaultParams: { a: 7, b: 3 }
      },
      {
        id: "sum3",
        label: "a^3+b^3",
        controls: [
          { key: "a", label: "a", min: 1, max: 6, step: 1 },
          { key: "b", label: "b", min: 1, max: 6, step: 1 }
        ],
        defaultParams: { a: 2, b: 3 }
      },
      {
        id: "diff3",
        label: "a^3-b^3",
        controls: [
          { key: "a", label: "a", min: 2, max: 6, step: 1 },
          { key: "b", label: "b", min: 1, max: 5, step: 1, dynamicMax: (params) => Math.max(1, params.a - 1) }
        ],
        defaultParams: { a: 5, b: 2 }
      }
    ];

    const modeMap = Object.fromEntries(MODE_DEFS.map((m) => [m.id, m]));
    const modeIds = MODE_DEFS.map((m) => m.id);

    const dom = {
      modeTabs: document.getElementById("modeTabs"),
      reduceMotionToggle: document.getElementById("reduceMotionToggle"),
      statsBtn: document.getElementById("statsBtn"),
      closeStatsBtn: document.getElementById("closeStatsBtn"),
      statsModal: document.getElementById("statsModal"),
      globalStats: document.getElementById("globalStats"),
      modeStats: document.getElementById("modeStats"),
      vizWrapper: document.getElementById("vizWrapper"),
      renderRoot: document.getElementById("renderRoot"),
      treeCanvas: document.getElementById("factorTreeCanvas"),
      labelLayer: document.getElementById("labelLayer"),
      overlayLeft: document.getElementById("overlayLeft"),
      overlayRight: document.getElementById("overlayRight"),
      exploreControls: document.getElementById("exploreControls"),
      equationCard: document.getElementById("equationCard"),

    const appState = {

    // ===== Utilities =====
    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function choice(arr) {
      return arr[randInt(0, arr.length - 1)];
    }

    function shuffle(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = randInt(0, i);
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function nearlyEqual(a, b, epsilon = 1e-9) {
      return Math.abs(a - b) <= epsilon;
    }

    function isPrime(n) {
      if (!Number.isInteger(n) || n < 2) return false;
      if (n === 2) return true;
      if (n % 2 === 0) return false;
      const end = Math.floor(Math.sqrt(n));
      for (let i = 3; i <= end; i += 2) {
        if (n % i === 0) return false;
      }
      return true;
    }

    function splitComposite(n) {
      if (isPrime(n)) return null;
      for (let i = 2; i <= Math.floor(Math.sqrt(n)); i += 1) {
        if (n % i === 0) return [i, Math.floor(n / i)];
      }
      return null;
    }

    function factorizePrimePowers(n) {
      let remaining = Math.abs(n);
      const out = [];
      let p = 2;
      while (p * p <= remaining) {
        let count = 0;
        while (remaining % p === 0) {
          remaining = Math.floor(remaining / p);
          count += 1;
        }
        if (count > 0) out.push([p, count]);
        p = p === 2 ? 3 : p + 2;
      }
      if (remaining > 1) out.push([remaining, 1]);
      return out;
    }

    function canonicalizeFactorArray(factors) {
      const map = new Map();
      for (const [base, exp] of factors) {
        map.set(base, (map.get(base) || 0) + exp);
      }
      return Array.from(map.entries()).sort((a, b) => a[0] - b[0]);
    }

    function parsePrimeFactorInput(raw) {
      if (typeof raw !== "string") return null;
      const trimmed = raw.trim();
      if (!trimmed) return null;
      if (trimmed.includes("**")) return null;
      const normalized = trimmed
        .replace(/×/g, "*")
        .replace(/\bx\b/gi, "*")
        .replace(/\s+/g, "");
      if (!normalized) return null;
      const tokens = normalized.split("*").filter(Boolean);
      if (tokens.length === 0) return null;
      const hasCaret = normalized.includes("^");
      if (hasCaret) {
        const factors = [];
        for (const token of tokens) {
          if (!/^\d+(\^\d+)?$/.test(token)) return null;
          const [baseText, expText] = token.split("^");
          const base = Number.parseInt(baseText, 10);
          const exp = expText ? Number.parseInt(expText, 10) : 1;
          if (!isPrime(base) || exp < 1) return null;
          factors.push([base, exp]);
        }
        return canonicalizeFactorArray(factors);
      }
      const factors = [];
      for (const token of tokens) {
        if (!/^\d+$/.test(token)) return null;
        const value = Number.parseInt(token, 10);
        if (!isPrime(value)) return null;
        factors.push([value, 1]);
      }
      return canonicalizeFactorArray(factors);
    }

    function areFactorizationsEqual(a, b) {
      if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
      for (let i = 0; i < a.length; i += 1) {
        if (a[i][0] !== b[i][0] || a[i][1] !== b[i][1]) return false;
      }
      return true;
    }

    function primeFactorsToKatex(factors) {
      const parts = factors.map(([base, exp]) => {
        if (exp === 1) return `${base}`;
        let expToken = `${exp}`;
        if (exp % 2 === 0 && exp % 3 === 0) {
          expToken = `\\color{${COLOR_HEX.result}}{${exp}}`;
        } else if (exp % 2 === 0) {
          expToken = `\\color{${COLOR_HEX.ab}}{${exp}}`;
        } else if (exp % 3 === 0) {
          expToken = `\\color{${COLOR_HEX.b}}{${exp}}`;
        }
        return `${base}^{${expToken}}`;
      });
      return parts.join(" \\times ");
    }

    function isPerfectSquare(n) {
      if (n < 0) return false;
      const root = Math.sqrt(n);
      return Number.isInteger(root);
    }

    function isPerfectCube(n) {
      if (n < 0) return false;
      const root = Math.cbrt(n);
      return nearlyEqual(root, Math.round(root), 1e-10);
    }

    function nearestPerfectSquare(n) {
      const lowRoot = Math.floor(Math.sqrt(n));
      const highRoot = Math.ceil(Math.sqrt(n));
      const lowSq = lowRoot * lowRoot;
      const highSq = highRoot * highRoot;
      const nearest = Math.abs(n - lowSq) <= Math.abs(highSq - n) ? lowSq : highSq;
      return { lowRoot, highRoot, lowSq, highSq, nearest };
    }

    function parsePairInput(raw) {
      if (typeof raw !== "string") return null;
      const cleaned = raw.trim();
      if (!cleaned) return null;
      const split = cleaned
        .replace(/×/g, "x")
        .replace(/\s+/g, "")
        .split(/[x,*]/g)
        .map((t) => t.trim())
        .filter(Boolean);
      if (split.length !== 2) return null;
      const values = split.map((t) => Number.parseInt(t, 10));
      if (values.some((v) => Number.isNaN(v))) return null;
      return values.sort((a, b) => a - b);
    }

    function createStreakDots(streak) {
      const filled = Math.max(0, Math.min(5, streak));
      return `${"●".repeat(filled)}${"○".repeat(5 - filled)}`;
    }

    function renderKatex(target, tex, displayMode = true) {
      if (!target) return;
      if (!window.katex || !tex) {
        target.textContent = tex || "";
        return;
      }
      try {
        window.katex.render(tex, target, { throwOnError: false, displayMode });
      } catch (error) {
        target.textContent = tex;
      }
    }

    class LabelManager {
      constructor(layerEl) {
        this.layerEl = layerEl;
        this.labels = [];
      }

      clear() {
        this.labels.forEach((label) => label.el.remove());
        this.labels = [];
      }

      addLabel({
        text = "",
        tex = "",
        className = "viz-label viz-label--medium",
        color = COLOR_HEX.text,
        groupId = "default",
        worldPos = null,
        getWorldPos = null,
        opacity = 1,
        depthCull = null
      }) {
        const el = document.createElement("div");
        el.className = className;
        el.dataset.targetOpacity = String(clamp(opacity, 0, 1));
        el.style.opacity = String(clamp(opacity, 0, 1));
        el.style.color = color;
        if (tex) {
          try {
            if (window.katex) {
              el.innerHTML = window.katex.renderToString(tex, {
                throwOnError: false,
                displayMode: false
              });
            } else {
              el.textContent = text || tex;
            }
          } catch (error) {
            el.textContent = text || tex;
          }
        } else {
          el.textContent = text;
        }
        this.layerEl.appendChild(el);
        const label = {
          el,
          groupId,
          worldPos: worldPos ? worldPos.clone() : null,
          getWorldPos,
          visible: true,
          depthCull
        };
        this.labels.push(label);
        return label;
      }

      removeLabel(label) {
        if (!label) return;
        label.el.remove();
        this.labels = this.labels.filter((x) => x !== label);
      }

      clearGroup(groupId) {
        const keep = [];
        for (const label of this.labels) {
          if (label.groupId === groupId) {
            label.el.remove();
          } else {
            keep.push(label);
          }
        }
        this.labels = keep;
      }

      setOpacity(label, value) {
        if (!label || !label.el) return;
        const safe = String(clamp(value, 0, 1));
        label.el.dataset.targetOpacity = safe;
        label.el.style.opacity = safe;
      }

      setVisible(label, visible) {
        if (!label || !label.el) return;
        label.visible = visible;
        label.el.style.display = visible ? "" : "none";
      }

      update(camera, canvas, defaultDepthCull = false) {
        if (!camera || !canvas) return;
        const rect = canvas.getBoundingClientRect();
        for (const label of this.labels) {
          if (!label.visible) continue;
          const world = label.getWorldPos
            ? label.getWorldPos()
            : label.worldPos;
          if (!world) continue;
          const v = world.clone().project(camera);
          const x = (v.x * 0.5 + 0.5) * rect.width;
          const y = (-v.y * 0.5 + 0.5) * rect.height;
          const inView = v.z > -1 && v.z < 1;
          const useDepthCull = label.depthCull == null ? defaultDepthCull : !!label.depthCull;
          if (!inView || (useDepthCull && (v.z > 1 || v.z < -1))) {
            label.el.style.display = "none";
            label.el.style.opacity = "0";
          } else {
            const targetOpacity = label.el.dataset.targetOpacity || "1";
            label.el.style.display = "";
            label.el.style.opacity = targetOpacity;
            label.el.style.left = `${x}px`;
            label.el.style.top = `${y}px`;
          }
        }
      }
    }

    function createDimensionLine(scene, labelManager, options) {
      const start = options.start.clone();
      const end = options.end.clone();
      const color = options.color ?? COLOR_NUM.a;
      const labelText = options.labelText ?? "";
      const labelTex = options.labelTex ?? "";
      const labelClass = options.labelClass ?? "viz-label viz-label--dim";
      const offset = options.offset ? options.offset.clone() : new THREE.Vector3(0, 0, 0);
      const tickSize = options.tickSize ?? 0.15;

      const a = start.clone().add(offset);
      const b = end.clone().add(offset);
      const dir = b.clone().sub(a);
      const len = dir.length() || 1;
      const dirNorm = dir.clone().normalize();
      let perp = new THREE.Vector3(-dirNorm.y, dirNorm.x, 0);
      if (perp.lengthSq() < 1e-6) {
        perp = new THREE.Vector3(0, 1, 0);
      }
      perp.normalize().multiplyScalar(tickSize);

      const points = [
        a.clone(), b.clone(),
        a.clone().sub(perp), a.clone().add(perp),
        b.clone().sub(perp), b.clone().add(perp)
      ];
      const geom = new THREE.BufferGeometry().setFromPoints(points);
      const opacity = options.opacity ?? 1;
      const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
      const lines = new THREE.LineSegments(geom, mat);
      scene.add(lines);

      const mid = a.clone().lerp(b, 0.5).add(perp.clone().multiplyScalar(2));
      const label = labelManager.addLabel({
        text: labelText,
        tex: labelTex,
        className: labelClass,
        color: `#${color.toString(16).padStart(6, "0")}`,
        groupId: options.groupId || "default",
        worldPos: mid,
        opacity: options.labelOpacity ?? opacity,
        depthCull: options.depthCull ?? null
      });

      return { mesh: lines, line: lines, ticks: lines, label, start: a, end: b, midpoint: mid };
    }

    function notifyVisualUpdate() {

    function safePercent(correct, attempts) {
      if (!attempts) return "0.0";
      return ((100 * correct) / attempts).toFixed(1);

    function randomByDifficulty(level) {
      if (level === 3 && Math.random() < 0.2) {
        return choice([441, 512, 625, 729, 900, 972]);
      }
      const [min, max] = DIFFICULTY_RANGES[level];
      return randInt(min, max);
    }

    function randomCompositeByDifficulty(level) {
      const [min, max] = DIFFICULTY_RANGES[level];
      for (let attempt = 0; attempt < 100; attempt += 1) {
        const n = randInt(min, max);
        if (!isPrime(n) && n > 1) return n;
      }
      return 12;
    }

    function randomABForDiff(level, maxA) {
      if (level === 1) {
        return { a: randInt(1, Math.min(4, maxA)), b: randInt(1, Math.min(4, maxA)) };
      }
      if (level === 2) {
        return { a: randInt(2, Math.min(7, maxA)), b: randInt(2, Math.min(7, maxA)) };
      }
      return { a: randInt(4, maxA), b: randInt(3, maxA) };
    }

    function clampDiffPair(a, b, maxA) {
      const aa = clamp(a, 2, maxA);
      const bb = clamp(b, 1, aa - 1);
      return { a: aa, b: bb };
    }

    // ===== Animation Queue =====
    class StepQueue {
      constructor(getReduceMotion) {
        this.getReduceMotion = getReduceMotion;
        this.steps = [];
        this.active = false;
        this.index = 0;
        this.elapsed = 0;
        this.pauseRemaining = 0;
        this.pendingStart = false;
      }

      run(steps) {
        this.steps = Array.isArray(steps) ? steps.slice() : [];
        this.active = this.steps.length > 0;
        this.index = 0;
        this.elapsed = 0;
        this.pauseRemaining = 0;
        this.pendingStart = false;
        if (this.active && this.steps[0].onStart) this.steps[0].onStart();
      }

      clear() {
        this.steps = [];
        this.active = false;
        this.index = 0;
        this.elapsed = 0;
        this.pauseRemaining = 0;
        this.pendingStart = false;
      }

      update(dtMs) {
        if (!this.active || this.index >= this.steps.length) return;
        if (this.pauseRemaining > 0) {
          this.pauseRemaining = Math.max(0, this.pauseRemaining - dtMs);
          if (this.pauseRemaining === 0 && this.pendingStart) {
            const next = this.steps[this.index];
            if (next && next.onStart) next.onStart();
            this.pendingStart = false;
          }
          return;
        }
        const step = this.steps[this.index];
        const durationBase = step.duration ?? DEFAULT_STEP_MS;
        const duration = this.getReduceMotion()
          ? Math.min(durationBase, REDUCED_STEP_MS)
          : durationBase;
        this.elapsed += dtMs;
        const t = duration <= 0 ? 1 : clamp(this.elapsed / duration, 0, 1);
        const eased = (step.easing || easeOutCubic)(t);
        if (step.onUpdate) step.onUpdate(eased, t);
        if (t >= 1) {
          if (step.onEnd) step.onEnd();
          this.pauseRemaining = this.getReduceMotion() ? 0 : (step.pause ?? 0);
          this.index += 1;
          this.elapsed = 0;
          if (this.index >= this.steps.length) {
            this.active = false;
            this.steps = [];
          } else {
            const next = this.steps[this.index];
            if (this.pauseRemaining > 0) {
              this.pendingStart = true;
            } else if (next.onStart) {
              next.onStart();
            }
          }
        }
      }
    }

    // ===== Scene Manager =====
    function disposeObject3D(root) {
      if (!root) return;
      root.traverse((child) => {
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          if (Array.isArray(child.material)) {
            child.material.forEach((m) => {
              if (m.map) m.map.dispose();
              m.dispose();
            });
          } else {
            if (child.material.map) child.material.map.dispose();
            child.material.dispose();
          }
        }
      });
    }

    class SceneManager {
      constructor(container) {
        this.container = container;
        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        this.renderer.setSize(container.clientWidth, container.clientHeight);
        this.renderer.setClearColor(COLOR_NUM.background, 1);
        this.renderer.outputColorSpace = THREE.SRGBColorSpace;
        this.container.appendChild(this.renderer.domElement);

        this.activeMode = null;
        this.raf = 0;
        this.last = performance.now();
        this.loop = this.loop.bind(this);
        this.onResize = this.onResize.bind(this);

        window.addEventListener("resize", this.onResize);
        document.addEventListener("visibilitychange", () => {
          this.last = performance.now();
        });
        this.raf = requestAnimationFrame(this.loop);
      }

      setMode(mode) {
        if (this.activeMode && this.activeMode.onDeactivate) this.activeMode.onDeactivate();
        this.activeMode = mode || null;
        if (this.activeMode && this.activeMode.onActivate) this.activeMode.onActivate(this);
        this.onResize();
      }

      loop(now) {
        const dtMs = Math.min(64, now - this.last);
        const dt = dtMs / 1000;
        this.last = now;
        if (this.activeMode) {
          if (this.activeMode.tick) this.activeMode.tick(dt, dtMs);
          if (this.activeMode.scene && this.activeMode.camera) {
            if (this.activeMode.controls) this.activeMode.controls.update();
            this.renderer.render(this.activeMode.scene, this.activeMode.camera);
            if (this.activeMode.updateLabels) {
              this.activeMode.updateLabels(this.renderer.domElement);
            }
          }
        }
        this.raf = requestAnimationFrame(this.loop);
      }

      onResize() {
        const width = this.container.clientWidth || 1;
        const height = this.container.clientHeight || 1;
        this.renderer.setSize(width, height);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        if (this.activeMode && this.activeMode.resize) this.activeMode.resize(width, height);
      }
    }

    class FactorTreeRenderer {
      constructor(canvas, getReduceMotion) {
        this.canvas = canvas;
        this.ctx = canvas.getContext("2d");
        this.getReduceMotion = getReduceMotion;
        this.number = 84;
        this.root = null;
        this.sequence = [];
        this.visibleCount = 0;
        this.playing = false;
        this.framePhase = 0;
        this.nodeById = new Map();
        this.nextId = 1;
      }

      resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const rect = this.canvas.getBoundingClientRect();
        const width = Math.max(20, Math.floor(rect.width * dpr));
        const height = Math.max(20, Math.floor(rect.height * dpr));
        if (this.canvas.width !== width || this.canvas.height !== height) {
          this.canvas.width = width;
          this.canvas.height = height;
        }
      }

      setNumber(n) {
        this.number = n;
        this.nextId = 1;
        this.nodeById.clear();
        this.root = this.buildTree(n);
        this.layoutTree();
        this.sequence = this.collectBfs();
        this.visibleCount = this.sequence.length;
        this.playing = false;
        this.draw();
      }

      buildTree(value) {
        const pair = splitComposite(value);
        const node = {
          id: this.nextId += 1,
          value,
          prime: isPrime(value),
          left: null,
          right: null,
          x: 0,
          y: 0,
          depth: 0
        };
        this.nodeById.set(node.id, node);
        if (pair) {
          node.prime = false;
          node.left = this.buildTree(pair[0]);
          node.right = this.buildTree(pair[1]);
        }
        return node;
      }

      layoutTree() {
        const width = this.canvas.width || 1;
        const maxDepth = this.getDepth(this.root);
        const horizontalPadding = 70;
        const topPadding = 50;
        const bottomPadding = 95;
        const usableHeight = Math.max(60, this.canvas.height - topPadding - bottomPadding);

        const assign = (node, depth, minX, maxX) => {
          if (!node) return;
          node.depth = depth;
          node.y = topPadding + (maxDepth === 0 ? 0 : (depth / maxDepth) * usableHeight);
          if (!node.left || !node.right) {
            node.x = (minX + maxX) / 2;
            return;
          }
          const mid = (minX + maxX) / 2;
          assign(node.left, depth + 1, minX, mid);
          assign(node.right, depth + 1, mid, maxX);
          node.x = (node.left.x + node.right.x) / 2;
        };

        assign(this.root, 0, horizontalPadding, width - horizontalPadding);
      }

      getDepth(node) {
        if (!node) return 0;
        if (!node.left && !node.right) return 0;
        return 1 + Math.max(this.getDepth(node.left), this.getDepth(node.right));
      }

      collectBfs() {
        const out = [];
        const q = [this.root];
        while (q.length) {
          const node = q.shift();
          if (!node) continue;
          out.push(node);
          if (node.left) q.push(node.left);
          if (node.right) q.push(node.right);
        }
        return out;
      }

      play() {
        if (!this.sequence.length) return;
        this.visibleCount = 0;
        this.playing = true;
      }

      tick(dtMs) {
        this.framePhase += dtMs / 1000;
        if (this.playing) {
          const step = this.getReduceMotion() ? REDUCED_STEP_MS : DEFAULT_STEP_MS;
          this.visibleCount += dtMs / Math.max(1, step);
          if (this.visibleCount >= this.sequence.length) {
            this.visibleCount = this.sequence.length;
            this.playing = false;
          }
        }
        this.draw();
      }

      draw() {
        this.resize();
        const ctx = this.ctx;
        const width = this.canvas.width;
        const height = this.canvas.height;

        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = "#101228";
        ctx.fillRect(0, 0, width, height);

        const visibleNodes = new Set();
        const reveal = Math.floor(this.visibleCount);
        for (let i = 0; i < reveal; i += 1) {
          if (this.sequence[i]) visibleNodes.add(this.sequence[i].id);
        }

        ctx.strokeStyle = "rgba(255,255,255,0.25)";
        ctx.lineWidth = 2;
        const drawEdge = (parent, child) => {
          if (!parent || !child) return;
          if (!visibleNodes.has(parent.id) || !visibleNodes.has(child.id)) return;
          ctx.beginPath();
          ctx.moveTo(parent.x, parent.y + 18);
          ctx.lineTo(child.x, child.y - 18);
          ctx.stroke();
        };

        const dfsEdge = (node) => {
          if (!node) return;
          drawEdge(node, node.left);
          drawEdge(node, node.right);
          dfsEdge(node.left);
          dfsEdge(node.right);
        };
        dfsEdge(this.root);

        const pulse = 0.15 + Math.sin(this.framePhase * 4) * 0.12;
        const drawNode = (node) => {
          if (!node || !visibleNodes.has(node.id)) return;
          const radius = 18 + (node.prime ? pulse * 8 : 0);
          ctx.beginPath();
          ctx.arc(node.x, node.y, radius, 0, Math.PI * 2);
          ctx.fillStyle = node.prime ? COLOR_HEX.prime : COLOR_HEX.composite;
          ctx.globalAlpha = node.prime ? 0.95 : 0.9;
          ctx.fill();
          ctx.globalAlpha = 1;
          ctx.strokeStyle = "rgba(255,255,255,0.35)";
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.fillStyle = "#0f0f23";
          ctx.font = "bold 14px Segoe UI";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(String(node.value), node.x, node.y);
        };

        const dfsNode = (node) => {
          if (!node) return;
          drawNode(node);
          dfsNode(node.left);
          dfsNode(node.right);
        };
        dfsNode(this.root);

        const factors = factorizePrimePowers(this.number);
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.font = "13px Segoe UI";
        ctx.fillStyle = "rgba(232,232,232,0.8)";
        ctx.fillText(`N = ${this.number}`, 16, height - 72);
        ctx.fillStyle = "rgba(131,193,103,0.95)";
        ctx.fillText("Even exponent => perfect square", 16, height - 48);
        ctx.fillStyle = "rgba(252,186,3,0.95)";
        ctx.fillText("Exponent multiple of 3 => perfect cube", 16, height - 28);

        let x = width - 16;
        for (let i = factors.length - 1; i >= 0; i -= 1) {
          const [prime, exp] = factors[i];
          const token = `${prime}${exp > 1 ? `^${exp}` : ""}`;
          ctx.font = "bold 14px Consolas";
          const tokenWidth = ctx.measureText(token).width;
          x -= tokenWidth;
          ctx.fillStyle = exp % 2 === 0 && exp % 3 === 0
            ? COLOR_HEX.result
            : exp % 2 === 0
              ? COLOR_HEX.ab
              : exp % 3 === 0
                ? COLOR_HEX.b
                : COLOR_HEX.text;
          ctx.fillText(token, x, height - 72);
          if (i > 0) {
            const mult = " × ";
            ctx.font = "13px Segoe UI";
            const mw = ctx.measureText(mult).width;
            x -= mw;
            ctx.fillStyle = "rgba(232,232,232,0.8)";
            ctx.fillText(mult, x, height - 72);
          }
        }
      }
    }

        if (!this.tileMesh) return;
        this.group.remove(this.tileMesh);

      rebuildTiles() {
        this.clearMesh();
        const n = this.params.n;
        this.totalCount = n * n;
        this.tileGeometry = this.tileGeometry || new THREE.BoxGeometry(0.94, 0.08, 0.94);

          roughness: 0.85,

        });

        const matrix = new THREE.Matrix4();
        let index = 0;
        for (let row = 0; row < n; row += 1) {
          for (let col = 0; col < n; col += 1) {
            const x = col - (n - 1) / 2;
            const z = row - (n - 1) / 2;
            matrix.makeTranslation(x, 0, z);
            this.tileMesh.setMatrixAt(index, matrix);
            index += 1;
          }
        }
        this.tileMesh.instanceMatrix.needsUpdate = true;
        this.tileMesh.count = this.totalCount;
        this.group.add(this.tileMesh);
        this.dimGroup.clear();
        labelManager.clearGroup(this.id);
        this.labels = [];

        this.labels.push(
          labelManager.addLabel({
            text: `Area = ${n * n}`,
            className: "viz-label viz-label--large",
            color: COLOR_HEX.a,
            groupId: this.id,
            worldPos: new THREE.Vector3(0, 0.8, -n * 0.7 - 1.4)
          })
        );

        createDimensionLine(this.dimGroup, labelManager, {
          start: new THREE.Vector3(-(n / 2), 0.08, n / 2 + 0.45),
          end: new THREE.Vector3(n / 2, 0.08, n / 2 + 0.45),
          color: COLOR_NUM.a,
          labelText: `${n}`,
          labelClass: "viz-label viz-label--dim",
          groupId: this.id,
          offset: new THREE.Vector3(0, 0, 0)
        });
        createDimensionLine(this.dimGroup, labelManager, {
          start: new THREE.Vector3(n / 2 + 0.45, 0.08, -n / 2),
          end: new THREE.Vector3(n / 2 + 0.45, 0.08, n / 2),
          color: COLOR_NUM.a,
          labelText: `${n}`,
          labelClass: "viz-label viz-label--dim",
          groupId: this.id,
          offset: new THREE.Vector3(0, 0, 0)
        });
      }

      clearBoundingSquares() {
        this.boundingGroup.clear();
      }

      showBoundingSquares(n) {
        this.clearBoundingSquares();
        if (isPerfectSquare(n)) return;
        const { lowRoot, highRoot } = nearestPerfectSquare(n);
        const createLine = (size, color, yOffset) => {
          const half = size / 2;
          const points = [
            new THREE.Vector3(-half, yOffset, -half),
            new THREE.Vector3(half, yOffset, -half),
            new THREE.Vector3(half, yOffset, half),
            new THREE.Vector3(-half, yOffset, half),
            new THREE.Vector3(-half, yOffset, -half)
          ];
          const geometry = new THREE.BufferGeometry().setFromPoints(points);
          const material = new THREE.LineBasicMaterial({ color });
          const line = new THREE.Line(geometry, material);
          this.boundingGroup.add(line);
        };
        createLine(lowRoot, 0x83c167, 0.12);
        createLine(highRoot, 0xfcba03, 0.2);
      }

      setParams(params) {
        this.params = { ...this.params, ...params };
        this.rebuildTiles();
        this.clearBoundingSquares();
      }

      resetExplore() {
        this.setParams({ n: 8 });
        this.progress = 1;
        this.animating = false;
      }

      playAnimation() {
        this.progress = 0;
        this.animating = true;
      }

      tick(dt) {
        if (!this.animating || !this.tileMesh) return;
        const duration = this.getReduceMotion() ? 0.1 : Math.max(1, this.params.n * 0.24);
        this.progress = clamp(this.progress + dt / duration, 0, 1);
        this.tileMesh.count = Math.max(1, Math.floor(this.totalCount * this.progress));
        if (this.progress >= 1) {
          this.tileMesh.count = this.totalCount;
          this.animating = false;
        }
      }

      updateLabels(canvas) {
        labelManager.update(this.camera, canvas);
      }

      equationTex() {
        const n = this.params.n;
        return `\\color{${COLOR_HEX.a}}{${n}^2} = ${n * n}`;
      }

      overlay() {
        return {
          left: `n = ${this.params.n} (tiles = ${this.params.n ** 2})`,
          right: "Orthographic n×n tile model"
        };
      }

      showDrillFeedback(problem) {
        if (!problem) return;
        if (typeof problem.n === "number") this.showBoundingSquares(problem.n);
      }
    }

      }

      resize(width, height) {
        const aspect = width / Math.max(1, height);
        const view = 26;
        this.camera.left = -(view * aspect) / 2;
        this.camera.right = (view * aspect) / 2;
        this.camera.top = view / 2;
        this.camera.bottom = -view / 2;
        this.camera.updateProjectionMatrix();
      }

      clearGroup() {
        if (!this.group) return;
        disposeObject3D(this.group);
        this.group.clear();
        this.regions = [];
        this.hLines = [];
        this.vLines = [];
        this.partitionLines = [];
        this.dimBottom = [];
        this.dimLeft = [];
        labelManager.clearGroup(this.id);
        this.regionLabels = [];
        this.bigLabel = null;
      }

      makeSegment(start, end, color) {
        const line = new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([start, end]),
          new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0 })
        );
        this.group.add(line);
        return line;
      }

      makeRegion(width, height, centerX, centerY) {
        const mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(width, height),
          new THREE.MeshStandardMaterial({
            color: this.baseRegionColor,
            roughness: 0.85,
            metalness: 0.03,
            transparent: true,
            opacity: 0
          })
        );
        mesh.position.set(centerX, centerY, 0);
        this.group.add(mesh);
        this.regions.push(mesh);
      }

      rebuild() {
        this.clearGroup();
        const { a, b } = this.params;
        const total = a + b;
        const offset = total / 2;
        const z = 0.24;
        const splitX = a - offset;
        const splitY = a - offset;

        this.hLines = [
          this.makeSegment(
            new THREE.Vector3(-offset, -offset, z),
            new THREE.Vector3(splitX, -offset, z),
            COLOR_NUM.a
          ),
          this.makeSegment(
            new THREE.Vector3(splitX, -offset, z),
            new THREE.Vector3(offset, -offset, z),
            COLOR_NUM.b
          )
        ];
        this.vLines = [
          this.makeSegment(
            new THREE.Vector3(-offset, -offset, z),
            new THREE.Vector3(-offset, splitY, z),
            COLOR_NUM.a
          ),
          this.makeSegment(
            new THREE.Vector3(-offset, splitY, z),
            new THREE.Vector3(-offset, offset, z),
            COLOR_NUM.b
          )
        ];

        this.baseSquare = new THREE.Mesh(
          new THREE.PlaneGeometry(total, total),
          new THREE.MeshStandardMaterial({
            color: 0x2a2a4a,
            transparent: true,
            opacity: 0,
            roughness: 0.92,
            metalness: 0.02
          })
        );
        this.group.add(this.baseSquare);

        const makePartition = (start, end) => {
          const line = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([start, end]),
            new THREE.LineDashedMaterial({
              color: 0xffffff,
              dashSize: 0.34,
              gapSize: 0.2,
              transparent: true,
              opacity: 0
            })
          );
          line.computeLineDistances();
          this.group.add(line);
          this.partitionLines.push(line);
        };
        makePartition(
          new THREE.Vector3(splitX, -offset, z),
          new THREE.Vector3(splitX, offset, z)
        );
        makePartition(
          new THREE.Vector3(-offset, splitY, z),
          new THREE.Vector3(offset, splitY, z)
        );

        this.makeRegion(a, a, a / 2 - offset, a / 2 - offset);
        this.makeRegion(a, b, a / 2 - offset, a + b / 2 - offset);
        this.makeRegion(b, a, a + b / 2 - offset, a / 2 - offset);
        this.makeRegion(b, b, a + b / 2 - offset, a + b / 2 - offset);

        this.bigLabel = labelManager.addLabel({
          tex: "(a+b)^2",
          className: "viz-label viz-label--large",
          color: COLOR_HEX.text,
          groupId: this.id,
          worldPos: new THREE.Vector3(0, 0, 0.4),
          opacity: 0
        });
        this.regionLabels = [
          labelManager.addLabel({
            tex: "a^2",
            className: "viz-label viz-label--medium",
            color: COLOR_HEX.a,
            groupId: this.id,
            getWorldPos: () => this.regions[0].position.clone().setZ(0.45),
            opacity: 0
          }),
          labelManager.addLabel({
            tex: "ab",
            className: "viz-label viz-label--medium",
            color: COLOR_HEX.ab,
            groupId: this.id,
            getWorldPos: () => this.regions[1].position.clone().setZ(0.45),
            opacity: 0
          }),
          labelManager.addLabel({
            tex: "ab",
            className: "viz-label viz-label--medium",
            color: COLOR_HEX.ab,
            groupId: this.id,
            getWorldPos: () => this.regions[2].position.clone().setZ(0.45),
            opacity: 0
          }),
          labelManager.addLabel({
            tex: "b^2",
            className: "viz-label viz-label--medium",
            color: COLOR_HEX.b,
            groupId: this.id,
            getWorldPos: () => this.regions[3].position.clone().setZ(0.45),
            opacity: 0
          })
        ];

        this.dimBottom = [
          createDimensionLine(this.group, labelManager, {
            start: new THREE.Vector3(-offset, -offset, z),
            end: new THREE.Vector3(splitX, -offset, z),
            color: COLOR_NUM.a,
            labelText: "a",
            groupId: this.id,
            offset: new THREE.Vector3(0, -0.62, 0),
            opacity: 0
          }),
          createDimensionLine(this.group, labelManager, {
            start: new THREE.Vector3(splitX, -offset, z),
            end: new THREE.Vector3(offset, -offset, z),
            color: COLOR_NUM.b,
            labelText: "b",
            groupId: this.id,
            offset: new THREE.Vector3(0, -0.62, 0),
            opacity: 0
          })
        ];
        this.dimLeft = [
          createDimensionLine(this.group, labelManager, {
            start: new THREE.Vector3(-offset, -offset, z),
            end: new THREE.Vector3(-offset, splitY, z),
            color: COLOR_NUM.a,
            labelText: "a",
            groupId: this.id,
            offset: new THREE.Vector3(-0.62, 0, 0),
            opacity: 0
          }),
          createDimensionLine(this.group, labelManager, {
            start: new THREE.Vector3(-offset, splitY, z),
            end: new THREE.Vector3(-offset, offset, z),
            color: COLOR_NUM.b,
            labelText: "b",
            groupId: this.id,
            offset: new THREE.Vector3(-0.62, 0, 0),
            opacity: 0
          })
        ];

        this.equationStage = 0;
        this.pulseStrength = 0;
        this.applyStepState(1);
      }

      setDimensionOpacity(items, opacity) {
        for (const item of items) {
          item.mesh.material.opacity = opacity;
          labelManager.setOpacity(item.label, opacity);
        }
      }

      applyTargets(targets) {
        for (const line of this.hLines) line.material.opacity = targets.hLine;
        for (const line of this.vLines) line.material.opacity = targets.vLine;
        this.baseSquare.material.opacity = targets.baseSquare;
        for (const line of this.partitionLines) line.material.opacity = targets.partition;

        for (let i = 0; i < this.regions.length; i += 1) {
          const region = this.regions[i];
          const mat = region.material;
          mat.opacity = targets.regionAlpha;
          mat.color.copy(this.baseRegionColor).lerp(this.regionColorTargets[i], targets.regionColor);
        }

        labelManager.setOpacity(this.bigLabel, targets.bigLabel);
        for (const label of this.regionLabels) labelManager.setOpacity(label, targets.regionLabel);
        this.setDimensionOpacity(this.dimBottom, targets.bottomDims);
        this.setDimensionOpacity(this.dimLeft, targets.leftDims);

        this.equationStage = targets.eq;
        this.pulseStrength = targets.pulse;
      }

      lerpTargets(start, end, t) {
        const out = {};
        for (const key of Object.keys(end)) {
          if (key === "eq") {
            out[key] = t < 0.7 ? start[key] : end[key];
          } else {
            out[key] = start[key] + (end[key] - start[key]) * t;
          }
        }
        return out;
      }

      setParams(params) {
        this.params = { ...this.params, ...params };
        this.rebuild();
      }

      resetExplore() {
        this.setParams({ a: 4, b: 3 });
      }

      hasStepControls() {
        return true;
      }

      getStepCount() {
        return 6;
      }

      getStepIndex() {
        return this.stepIndex;
      }

      getStepTargets(step) {
        if (step <= 1) {
          return {
            hLine: 1, vLine: 0, baseSquare: 0, partition: 0, regionColor: 0, regionAlpha: 0, regionLabel: 0,
            bottomDims: 1, leftDims: 0, bigLabel: 0, eq: 0, pulse: 0
          };
        }
        if (step === 2) {
          return {
            hLine: 1, vLine: 1, baseSquare: 0, partition: 0, regionColor: 0, regionAlpha: 0, regionLabel: 0,
            bottomDims: 1, leftDims: 0, bigLabel: 0, eq: 0, pulse: 0
          };
        }
        if (step === 3) {
          return {
            hLine: 0.6, vLine: 0.6, baseSquare: 0.88, partition: 0, regionColor: 0, regionAlpha: 0, regionLabel: 0,
            bottomDims: 0, leftDims: 0, bigLabel: 1, eq: 1, pulse: 0
          };
        }
        if (step === 4) {
          return {
            hLine: 0.3, vLine: 0.3, baseSquare: 0.88, partition: 1, regionColor: 0, regionAlpha: 0, regionLabel: 0,
            bottomDims: 0, leftDims: 0, bigLabel: 0.9, eq: 2, pulse: 0
          };
        }
        if (step === 5) {
          return {
            hLine: 0.15, vLine: 0.15, baseSquare: 0.35, partition: 1, regionColor: 1, regionAlpha: 0.98, regionLabel: 1,
            bottomDims: 1, leftDims: 1, bigLabel: 0, eq: 3, pulse: 0
          };
        }
        return {
          hLine: 0.15, vLine: 0.15, baseSquare: 0.25, partition: 1, regionColor: 1, regionAlpha: 0.98, regionLabel: 1,
          bottomDims: 1, leftDims: 1, bigLabel: 0, eq: 4, pulse: 1
        };
      }

      applyStepState(step) {
        const clamped = clamp(step, 1, this.getStepCount());
        this.stepIndex = clamped;
        this.queue.clear();
        this.applyTargets(this.getStepTargets(clamped));
        notifyVisualUpdate();
      }

      setStep(step, animate = false) {
        const clamped = clamp(step, 1, this.getStepCount());
        if (!animate || this.getReduceMotion()) {
          this.applyStepState(clamped);
          return;
        }
        const start = this.getStepTargets(this.stepIndex);
        const end = this.getStepTargets(clamped);
        this.queue.clear();
        this.queue.run([
          {
            duration: DEFAULT_STEP_MS,
            pause: INTER_STEP_PAUSE_MS,
            onUpdate: (t) => {
              this.applyTargets(this.lerpTargets(start, end, t));
            },
            onEnd: () => {
              this.stepIndex = clamped;
              this.applyTargets(end);
              notifyVisualUpdate();
            }
          }
        ]);
      }

      playAnimation() {
        this.setStep(this.getStepCount(), true);
      }

      tick(_dt, dtMs) {
        this.queue.update(dtMs);
        this.pulsePhase += dtMs / 1000;
        const scale = 1 + Math.sin(this.pulsePhase * 8) * 0.07 * this.pulseStrength;
        for (let i = 1; i <= 2; i += 1) {
          const label = this.regionLabels[i];
          if (!label || !label.el) continue;
          label.el.style.transform = `translate(-50%, -50%) scale(${scale.toFixed(3)})`;
        }
      }

      updateLabels(canvas) {
        labelManager.update(this.camera, canvas);
      }

      equationTex() {
        const { a, b } = this.params;
        if (this.equationStage === 0) {
          return `${a}+${b}`;
        }
        if (this.equationStage === 1) {
          return `(${a}+${b})^2`;
        }
        if (this.equationStage === 2) {
          return `(${a}+${b})^2 = ?`;
        }
        if (this.equationStage === 3) {
          return `(${a}+${b})^2 = \\color{${COLOR_HEX.a}}{${a ** 2}} + \\color{${COLOR_HEX.ab}}{${a * b}} + \\color{${COLOR_HEX.ab}}{${a * b}} + \\color{${COLOR_HEX.b}}{${b ** 2}}`;
        }
        return `(${a}+${b})^2 = \\color{${COLOR_HEX.a}}{${a ** 2}} + \\color{${COLOR_HEX.ab}}{${2 * a * b}} + \\color{${COLOR_HEX.b}}{${b ** 2}}`;
      }

      overlay() {
        const messages = [
          "Side length a+b",
          "Duplicate and rotate side",
          "Sweep square area",
          "Partition into four regions",
          "Color and label regions",
          "Combine like terms (2ab)"
        ];
        const { a, b } = this.params;
        return {
          left: `Step ${this.stepIndex}/6 | a=${a}, b=${b}`,
          right: messages[this.stepIndex - 1]
        };
      }

      showDrillFeedback(problem) {
        if (!problem) return;
        if (problem.a && problem.b) this.setParams({ a: problem.a, b: problem.b });
        this.playAnimation();
      }
    }
